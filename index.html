<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#F5F0E4; --card:#FFFCF5; --accent:#4E7C77; --accent-dark:#3F6863;
    --submit:#4E7C77; --submit-dark:#3F6863;
    --text:#2C2519; --muted1:#6D6354; --muted2:#998C77; --muted3:#C2B5A0;
    --free:#AEC9E0; --pref:#7E9C7F; --no:#C0524E; --border:#E5DCCA; --line:#F0E9D9;
    --brand:#4E7C77; --brand-soft:#E7EFEC;
    --pref-ink:#5C7860; --free-ink:#425F7D;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;}
  body{background:#F3EDDF;background-image:linear-gradient(180deg, #FCF8EF 0%, #F4EEE0 40%, #EBE2CF 100%);background-attachment:fixed;color:var(--text);font-family:'General Sans','Plus Jakarta Sans',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;position:relative;line-height:1.5;}
  h1,h2,h3{font-family:'General Sans',system-ui,sans-serif;font-weight:700;letter-spacing:-0.03em;}
  #app{position:relative;z-index:1;max-width:540px;margin:0 auto;padding:30px 18px 90px;}
  /* ambient background: converging contour paths + soft paper grain */
  .bg-field{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;}
  .bg-field svg{position:absolute;top:0;left:0;width:100%;height:100%;display:block;}
  .bg-grain{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.5;mix-blend-mode:multiply;background-repeat:repeat;background-size:200px 200px;}
  @media (prefers-reduced-motion: reduce){ .bg-field{opacity:.85;} }
  .card{background:var(--card);border:none;border-radius:22px;padding:24px 22px;margin-bottom:22px;box-shadow:0 1px 2px rgba(36,30,23,0.03), 0 20px 44px -30px rgba(36,30,23,0.16);}
  .title{font-size:34px;margin:0 0 6px;font-weight:700;letter-spacing:-0.035em;line-height:1.04;color:var(--text);}
  .event-title{font-size:41px;margin:0 0 12px;font-weight:700;letter-spacing:-0.04em;line-height:0.99;color:var(--text);}
  .title-rule{width:44px;height:3px;border-radius:2px;background:var(--brand);margin:0 0 16px;}
  .wm-mini{display:inline-flex;align-items:center;gap:7px;font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:13px;letter-spacing:.01em;color:var(--muted2);}
  .event-hero-img{position:relative;height:150px;border-radius:20px;background-size:cover;background-position:center;margin-bottom:30px;box-shadow:0 20px 44px -30px rgba(36,30,23,0.5);}
  .event-hero-img .wm-mini{position:absolute;top:14px;right:16px;color:rgba(255,255,255,0.95);text-shadow:0 1px 8px rgba(0,0,0,0.35);}
  .hero{position:relative;overflow:hidden;border-radius:24px;background-size:cover;background-position:center;min-height:172px;padding:16px 20px;display:flex;flex-direction:column;justify-content:space-between;margin-bottom:14px;box-shadow:0 1px 2px rgba(30,42,34,0.05), 0 24px 50px -30px rgba(30,42,34,0.5);}
  .hero::before,.hero::after{display:none !important;}
  .hero-deco{display:none !important;}
  .hero-wm{align-self:flex-end;display:flex;align-items:center;gap:8px;color:#fff;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:16px;letter-spacing:-0.02em;position:relative;z-index:1;}
  .brandHome{cursor:pointer;}
  .hero-btm{position:relative;z-index:1;}
  .hero .title{color:#fff;font-size:30px;line-height:1.05;text-shadow:0 2px 16px rgba(0,0,0,0.3);margin:0;}
  .hero .time-banner{color:rgba(255,255,255,0.92);border-top-color:rgba(255,255,255,0.28);margin-bottom:0;}
  .vday{background:var(--card);border:1px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden;}
  .vday.needs{box-shadow:0 0 0 2px var(--accent);transition:box-shadow .4s cubic-bezier(.22,1,.36,1);}
  .vote-row{display:flex;align-items:center;gap:10px;padding:17px 15px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .vr-date{min-width:50px;flex-shrink:0;}
  .vr-dow{display:block;font-size:9.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted2);}
  .vr-dnum{font-weight:700;font-size:15px;letter-spacing:-.01em;color:var(--text);}
  .avail{flex:1;height:5px;border-radius:3px;background:#F3EEE4;overflow:hidden;min-width:22px;}
  .avail>span{display:block;height:100%;background:#7FB08C;border-radius:3px;transition:width .6s cubic-bezier(.22,1,.36,1);}
  .dstate{display:flex;gap:6px;flex-shrink:0;align-items:center;}
  .section-label{font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted3);margin:22px 0 12px;}
  .section-label:first-child{margin-top:2px;}
  .card > .section-label:first-child{margin-top:0;}
  .legc{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted1);font-weight:500;}
  .legc i{width:9px;height:9px;border-radius:3px;display:inline-block;}
  .cbar{display:flex;height:6px;border-radius:4px;overflow:hidden;flex:1;min-width:40px;background:var(--border);}
  .cbar>span{display:block;height:100%;}
  .vr-chev{width:15px;height:15px;color:var(--muted2);flex-shrink:0;transition:transform .3s ease;}
  .vday.exp .vr-chev{transform:rotate(180deg);}
  .vr-detail{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.22,1,.36,1);}
  .vday.exp .vr-detail{max-height:340px;}
  .avail-item{border-bottom:1px solid var(--line);}
  .avail-item:last-child{border-bottom:none;}
  .avail-head{display:flex;align-items:center;gap:14px;padding:15px 2px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .avail-item.exp .vr-detail{max-height:520px;}
  .avail-item.exp .vr-chev{transform:rotate(180deg);}
  .brk{display:flex;align-items:center;gap:10px;}
  .blab{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;width:42px;flex-shrink:0;}
  .details-banner{font-size:14px;color:var(--muted1);display:flex;flex-direction:column;gap:4px;}
  .details-banner strong{color:var(--text);}
  .invitees-banner-title{font-size:12px;font-weight:600;color:var(--muted2);text-transform:uppercase;letter-spacing:.12em;margin:0 0 12px;}
  .subtitle{color:var(--muted1);font-size:15px;margin:0 0 22px;line-height:1.55;}
  label{display:block;font-size:11.5px;font-weight:600;color:var(--muted2);margin-bottom:7px;text-transform:uppercase;letter-spacing:.1em;}
  input[type=text], input[type=password], input[type=date], input[type=email]{
    width:100%;box-sizing:border-box;padding:14px 15px;font-size:16px;font-family:'General Sans',system-ui,sans-serif;font-weight:500;
    border:1px solid var(--border);border-radius:13px;background:#FFFFFF;color:var(--text);margin-bottom:16px;
  }
  input:focus{outline:none;border-color:var(--pref);box-shadow:0 0 0 3px rgba(74,145,102,0.13);}
  button{font-family:'General Sans',system-ui,sans-serif;font-weight:600;font-size:15.5px;border:none;border-radius:16px;padding:18px 26px;cursor:pointer;min-height:54px;transition:transform .25s cubic-bezier(.4,0,.2,1), background .25s ease, box-shadow .25s ease;}
  button:active{transform:scale(.99);}
  .btn-submit,.btn-primary{box-shadow:0 10px 22px -14px rgba(78,124,119,0.85);}
  .btn-primary{background:var(--accent);color:#fff;width:100%;}
  .btn-primary:active{background:var(--accent-dark);}
  .btn-primary:disabled{background:var(--muted3);cursor:not-allowed;}
  .btn-brand{background:var(--accent);color:#fff;width:100%;box-shadow:0 12px 24px -16px rgba(78,124,119,.9);}
  .btn-brand:active{background:var(--accent-dark);}
  .btn-brand:disabled{background:var(--muted3);cursor:not-allowed;color:#fff;}
  .btn-submit{background:var(--submit);color:#fff;width:100%;}
  .btn-submit:active{background:var(--submit-dark);}
  .btn-submit:disabled{background:var(--muted3);cursor:not-allowed;}
  .btn-secondary{background:#FFF;color:var(--text);border:1px solid var(--border);width:100%;}
  .text-toggle{background:none;border:none;color:var(--muted1);font-size:13.5px;font-weight:600;padding:12px 2px;width:100%;text-align:left;min-height:auto;cursor:pointer;}
  .text-toggle:active{transform:none;color:var(--text);}
  .admin-section{font-size:19px;font-weight:700;letter-spacing:-0.02em;color:var(--text);margin:8px 2px 16px;padding-top:26px;border-top:1px solid var(--border);}
  .admin-section:first-of-type{border-top:none;padding-top:8px;}
  .admin-group{margin-bottom:34px;}
  .admin-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--muted2);margin:26px 0 13px;}
  .admin-hdr{font-size:35px;font-weight:700;letter-spacing:-0.035em;line-height:1.06;margin:0 0 30px;padding-bottom:2px;}
  .card.plain{background:transparent;box-shadow:none;padding:0;margin-bottom:14px;}
  .card.advanced{background:transparent;box-shadow:none;border:1px solid var(--line);padding:18px;margin-bottom:12px;}
  .card.advanced h2{font-size:15px;color:var(--muted1);}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  .time-banner{display:inline-flex;align-items:center;gap:7px;background:none;color:var(--muted1);border-radius:0;padding:6px 0 0;border-top:1px solid var(--border);font-size:12px;font-weight:600;letter-spacing:.02em;margin-bottom:14px;}
  .date-chip{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:13px;border:1px solid var(--border);background:#FFFFFF;margin-bottom:8px;min-height:44px;font-weight:600;}
  .date-chip button{background:transparent;color:var(--no);padding:6px 10px;font-size:13px;}
  .day-row{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:#FFFFFF;margin-bottom:8px;min-height:46px;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  .day-row .dname{font-weight:700;font-size:15px;letter-spacing:-.01em;}
  .day-row .dstate{display:flex;align-items:center;gap:8px;}
  .day-row .slabel{font-size:12px;font-weight:600;color:var(--muted2);}
  .day-row .dcheck{width:26px;height:26px;border-radius:50%;border:2px solid var(--muted3);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff;}
  /* ===== Convergence motion language ===== */
  /* everything glides toward resolution — one easing, no bounce */
  .stbtn{transition:transform .3s cubic-bezier(.22,1,.36,1), background .25s ease, border-color .25s ease, color .25s ease;}
  .stbtn:active{transform:scale(0.97);}
  /* selected state settles via a calm colour transition — no scale pop */
  #app.enter{animation:fadeInUp .55s cubic-bezier(.22,1,.36,1) both;}
  @keyframes fadeInUp{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  /* rows settle in sequence — alignment, not a jump */
  .vday,.cday,.heat-row,.friend-row{animation:settleRow .5s cubic-bezier(.22,1,.36,1) both;}
  @keyframes settleRow{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  /* a presence entering the room */
  .enter-room{animation:enterRoom .5s cubic-bezier(.22,1,.36,1) both;}
  @keyframes enterRoom{0%{opacity:0;transform:translateY(7px) scale(.72);}100%{opacity:1;transform:translateY(0) scale(1);}}
  /* the gather — a presence travelling along a curved path into a choice */
  .gather-dot{position:fixed;left:0;top:0;width:11px;height:11px;border-radius:50%;pointer-events:none;z-index:3000;
    box-shadow:0 2px 6px rgba(36,30,23,0.2);offset-rotate:0deg;animation:gatherTravel .6s cubic-bezier(.22,1,.36,1) forwards;}
  @keyframes gatherTravel{0%{offset-distance:0%;opacity:0;}22%{opacity:.85;}78%{opacity:.85;}100%{offset-distance:100%;opacity:0;}}
  /* the submit thread — response travelling into the group */
  .thread-svg{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:2900;}
  .thread-svg path{fill:none;stroke:var(--pref);stroke-width:2.5;stroke-linecap:round;
    stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:threadDraw .55s cubic-bezier(.4,0,.2,1) forwards;}
  @keyframes threadDraw{to{stroke-dashoffset:0;}}
  @keyframes threadResolve{from{opacity:0;transform:translateY(-14px);}to{opacity:1;transform:translateY(0);}}
  .arrive{animation:arriveSettle .85s cubic-bezier(.22,1,.36,1) both;animation-delay:.28s;}
  @keyframes arriveSettle{0%{opacity:0;transform:translateY(10px);}100%{opacity:1;transform:translateY(0);}}
  @keyframes convergeIn{from{transform:translateX(var(--from));opacity:0;}to{transform:translateX(0);opacity:1;}}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.01ms !important;}}
  .escape-link{display:block;text-align:center;font-size:13px;color:var(--muted1);text-decoration:underline;margin:6px 0 18px;}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .cal-nav strong{font-family:'General Sans',system-ui,sans-serif;font-weight:600;font-size:15px;}
  .cal-nav button{background:transparent;color:var(--muted1);border:1px solid var(--border);width:auto;padding:6px 12px;font-size:13px;min-height:32px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:14px;}
  .cal-head{text-align:center;font-size:11px;font-weight:600;color:var(--muted2);}
  .cal-cell{position:relative;aspect-ratio:1;border-radius:999px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:11px;cursor:pointer;border:1px solid var(--border);background:#FFFFFF;color:var(--text);}
  .cal-cell.disabled{cursor:default;color:var(--muted3);border-color:transparent;background:transparent;}
  .cal-cell.blank{visibility:hidden;}
  .cal-dot{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:#C06A4F;}
  .clash-note{display:flex;align-items:flex-start;gap:8px;background:#FBEEE8;border:1px solid #EAC7BA;color:#8A4A38;border-radius:11px;padding:9px 12px;font-size:12.5px;line-height:1.4;margin:-6px 0 14px;}
  .clash-note svg{flex:0 0 auto;width:14px;height:14px;margin-top:1px;}
  .wh-q{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--text);margin:28px 0 12px;}
  .wh-q .wh-opt{font-family:'General Sans',sans-serif;font-size:14px;font-weight:500;color:var(--muted2);}
  .wc-people{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:2px;}
  .wc-av{position:relative;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;cursor:pointer;flex:0 0 auto;}
  .wc-av .wc-x{position:absolute;top:-3px;right:-3px;width:18px;height:18px;border-radius:50%;background:#2C2519;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s;}
  .wc-av:hover .wc-x{opacity:1;}
  .wc-add{width:44px;height:44px;border-radius:50%;border:1.5px dashed var(--muted3);background:transparent;color:var(--muted2);font-size:22px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;min-height:auto;flex:0 0 auto;}
  .wc-add:hover{border-color:var(--accent);color:var(--accent);}
  .wc-input input{width:150px;margin:0;padding:11px 13px;}
  .sp{position:relative;display:flex;width:100%;aspect-ratio:1200/540;border-radius:15px;overflow:hidden;border:1px solid var(--border);background:#F5F0E4;cursor:pointer;font-family:'Space Grotesk',sans-serif;text-transform:none;letter-spacing:normal;}
  .sp-l{flex:1.15;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;min-width:0;}
  .sp-h{font-size:30px;font-weight:700;letter-spacing:-.03em;color:#2C2519;line-height:1.0;}
  .sp-name{font-size:16px;font-weight:700;letter-spacing:-.01em;color:#4E7C77;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .sp-r{flex:0.85;position:relative;overflow:hidden;}
  .sp-r img{width:100%;height:100%;object-fit:cover;display:block;}
  .sp-teal{width:100%;height:100%;background:linear-gradient(150deg,#4E7C77,#3F6863);}
  .sp-scrim{position:absolute;inset:0;background:linear-gradient(to top,rgba(20,14,6,.34),rgba(20,14,6,0) 42%);}
  .sp-lock{position:absolute;bottom:12px;right:12px;display:flex;align-items:center;gap:6px;}
  .sp-lock svg{width:18px;height:18px;}
  .sp-lock span{font-size:13px;font-weight:700;letter-spacing:-.02em;color:#FBF7EE;text-shadow:0 1px 4px rgba(0,0,0,.35);}
  .sp-msg{border-radius:16px;overflow:hidden;background:#ECE7DC;border:1px solid var(--border);}
  .sp-msg .sp{border-radius:0;border:none;}
  .sp-foot{padding:11px 14px;}
  .sp-foot .t{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;color:var(--text);}
  .sp-foot .u{font-size:12.5px;color:var(--muted2);margin-top:2px;}
  .sp-edit{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(255,252,245,.94);display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px -3px rgba(44,37,25,.45);color:var(--text);z-index:2;}
  .sp-edit svg{width:16px;height:16px;}
  .faces{display:flex;flex-wrap:wrap;gap:14px;}
  .face{position:relative;width:56px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-transform:none;letter-spacing:normal;}
  .face-cam{position:absolute;top:-3px;right:4px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border:2px solid #FFFCF5;line-height:1;}
  .face .nm{font-size:11px;color:var(--text);font-weight:600;text-align:center;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .result-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:8px;}
  .result-cal-cell{min-height:52px;border-radius:13px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid var(--border);background:#FFFFFF;cursor:pointer;}
  .result-cal-cell.blank{visibility:hidden;}
  .result-cal-cell .rdate{font-weight:700;font-size:13px;color:var(--text);}
  .result-cal-cell .rcount{font-size:9px;font-weight:600;color:var(--muted1);text-align:center;line-height:1.25;}
  .heat-row{padding:14px 0;border-bottom:1px solid var(--border);cursor:pointer;}
  .heat-row:last-child{border-bottom:none;}
  .heat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .heat-bars{display:flex;height:7px;border-radius:5px;overflow:hidden;background:var(--border);}
  .badge{font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px;}
  .badge.free{background:rgba(166,207,242,.26);color:#2F4F7A;}
  .badge.pref{background:rgba(74,145,102,.18);color:#3F7C57;}
  .badge.no{background:rgba(192,82,78,.12);color:var(--no);}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#1E2A22;color:#F7F2E8;padding:11px 20px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s ease, transform .25s ease;z-index:1000;box-shadow:0 8px 24px rgba(0,0,0,0.18);max-width:80vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:12px;flex-shrink:0;}
  .friend-row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .friend-row:last-child{border-bottom:none;}
  .friend-actions{display:flex;gap:7px;flex-wrap:wrap;width:100%;padding-left:56px;margin-top:-4px;}
  .friend-actions button, .friend-actions .photoLabel{font-size:12px;font-weight:600;min-height:auto;padding:6px 11px;border-radius:10px;}
  .attendee-row{padding:16px 0;border-bottom:1px solid var(--line);}
  .attendee-row:last-child{border-bottom:none;}
  .attendee-top{display:flex;align-items:center;gap:12px;}
  .attendee-name{flex:1;min-width:0;}
  .attendee-remove{background:transparent;color:var(--muted3);font-size:20px;line-height:1;min-height:auto;padding:4px 6px;flex-shrink:0;border:none;}
  .attendee-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;padding-left:56px;}
  .attendee-actions > button, .attendee-actions > .photoLabel{font-size:12.5px;font-weight:600;min-height:36px;padding:8px 14px;border-radius:11px;border:1px solid var(--border);background:#FFFFFF;color:var(--muted1);display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer;white-space:nowrap;line-height:1;width:auto;box-shadow:none;text-transform:none;letter-spacing:normal;margin:0;}
  .attendee-actions > button:active, .attendee-actions > .photoLabel:active{transform:scale(.98);}
  .attendee-actions button.org-on{background:var(--accent);border-color:var(--accent);color:#FFED9E;}
  .attendee-actions .photoInput{display:none;}
  .link-box{display:flex;gap:8px;align-items:center;background:#FFFFFF;border:1px dashed var(--border);border-radius:13px;padding:12px;font-size:13px;color:var(--muted1);word-break:break-all;}
  a{color:var(--accent);}
  .top-link{font-size:13px;color:var(--muted1);text-decoration:none;display:inline-block;margin-bottom:12px;}
  .center{text-align:center;}
  .muted{color:var(--muted1);font-size:13px;}
  .error{color:var(--no);font-size:13px;margin:-8px 0 16px;}
  .spinner{width:20px;height:20px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:spin .7s linear infinite;margin:0 auto;}
  @keyframes spin{to{transform:rotate(360deg);}}
  /* ---- host home: My Plans ---- */
  .create-pill{display:inline-flex;align-items:center;gap:6px;padding:11px 18px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;background:#C06A4F;color:#fff;white-space:nowrap;box-shadow:0 10px 20px -14px rgba(192,106,79,.9);border:none;}
  .create-pill:active{background:#A85941;transform:scale(.99);}
  .plan-section{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);margin:32px 2px 12px;}
  .plan-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:12px;margin-bottom:12px;text-decoration:none;color:inherit;box-shadow:0 1px 2px rgba(44,37,25,.04),0 18px 34px -30px rgba(44,37,25,.4);transition:transform .5s cubic-bezier(.16,1,.3,1);}
  .plan-card:active{transform:scale(.99);}
  .plan-cover{width:74px;height:74px;border-radius:13px;background-size:cover;background-position:center;flex-shrink:0;}
  .plan-cover.noimg{background:linear-gradient(150deg,#5A857F,#3F6863);display:flex;align-items:center;justify-content:center;}
  .plan-cardbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .plan-title{font-weight:700;font-size:18px;letter-spacing:-.02em;line-height:1.12;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .plan-meta{font-size:13px;color:var(--muted1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .plan-chip{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;flex-shrink:0;white-space:nowrap;}
  .plan-chip.live{background:var(--brand-soft);color:var(--accent-dark);}
  .plan-chip.draft{background:#EDE4D3;color:var(--muted1);}
  .plan-chip.prog{background:#DCE7F0;color:#47688A;}
  .plan-chip.set{background:rgba(126,156,127,.22);color:var(--pref-ink);}
  .plan-chip.past{background:#ECE4D4;color:var(--muted2);}
  .plan-card.faded{opacity:.72;}
  .home-empty{text-align:center;padding:30px 20px 10px;}
  .home-empty-mark{display:inline-flex;border-radius:16px;overflow:hidden;box-shadow:0 14px 28px -14px rgba(78,124,119,.7);}
  /* ---- organizer workspace ---- */
  .org-tabs{display:flex;gap:5px;background:#E4D8BF;border-radius:14px;padding:5px;margin:8px 0 22px;position:sticky;top:8px;z-index:20;}
  .org-tab{flex:1;text-align:center;font-weight:700;font-size:13px;color:var(--muted1);background:transparent;border:none;padding:11px 4px;border-radius:10px;cursor:pointer;min-height:auto;transition:background .4s cubic-bezier(.16,1,.3,1),color .3s;}
  .org-tab.active{background:var(--card);color:var(--text);box-shadow:0 6px 16px -10px rgba(44,37,25,.4);}
  .cover-edit{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:50%;background:rgba(255,252,245,.92);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 3px 10px -3px rgba(44,37,25,.45);color:var(--text);transition:transform .2s,background .2s;}
  .cover-edit:hover{transform:scale(1.06);background:#FFFFFF;}
  .cover-edit svg{width:18px;height:18px;}
  .cover-add{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--accent);cursor:pointer;text-transform:none;letter-spacing:normal;}
  .cover-add svg{width:16px;height:16px;}
  .photo-add-link{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:14px;color:var(--accent);cursor:pointer;text-transform:none;letter-spacing:normal;}
  .photo-add-link svg{width:16px;height:16px;flex-shrink:0;}
  .photo-add-link.has-file{color:var(--pref-ink);}
  .org-panel{display:none;}
  .org-panel.active{display:block;animation:orgfade .55s cubic-bezier(.16,1,.3,1);}
  @keyframes orgfade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .org-cover{height:154px;border-radius:18px;background-size:cover;background-position:center;margin-bottom:16px;box-shadow:0 20px 44px -30px rgba(36,30,23,.5);position:relative;}
  .org-cover .wm-mini{position:absolute;top:12px;right:14px;color:rgba(255,255,255,.95);text-shadow:0 1px 8px rgba(0,0,0,.35);}
  /* landing breaks out of the 540px app column to full width */
  .landing{position:relative;left:50%;right:50%;width:100vw;margin-left:-50vw;margin-right:-50vw;min-height:min(100vh,860px);box-sizing:border-box;display:flex;flex-direction:column;}
  .landing-inner{flex:1;display:flex;flex-direction:column;width:100%;max-width:1080px;margin:0 auto;padding:0 clamp(20px,5vw,44px);box-sizing:border-box;}
  .landing-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 0;}
  .landing-brand{display:flex;align-items:center;gap:9px;}
  .landing-nav{display:flex;align-items:center;gap:18px;}
  .landing-open{font-size:14px;color:var(--muted1);text-decoration:none;font-weight:600;white-space:nowrap;transition:color .3s;}
  .landing-open:hover{color:var(--accent);}
  @media(max-width:430px){.landing-nav{gap:14px;}.landing-open{font-size:13px;}}
  .hero-grid{flex:1;display:grid;grid-template-columns:1fr;gap:44px;align-content:center;align-items:center;padding:5vh 0 6vh;}
  .hero-copy{display:flex;flex-direction:column;align-items:flex-start;}
  .landing-h1{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.042em;line-height:.98;font-size:clamp(42px,10vw,66px);color:var(--text);margin:0 0 26px;max-width:13ch;}
  .landing-sub{font-size:18.5px;font-weight:500;line-height:1.5;color:var(--muted1);max-width:30ch;margin:0 0 40px;}
  .landing-cta{align-self:flex-start;background:var(--accent);color:#FBF7EE;font-weight:700;font-size:17px;padding:15px 34px;border-radius:14px;text-decoration:none;box-shadow:none;transition:transform .4s cubic-bezier(.16,1,.3,1),background .3s;}
  .landing-cta:hover{background:var(--accent-dark);transform:translateY(-1px);}
  .landing-trust{display:flex;align-items:center;gap:11px;margin-top:22px;font-size:12.5px;color:var(--muted2);font-weight:500;}
  .landing-trust i{width:3px;height:3px;border-radius:50%;background:var(--muted3);display:inline-block;}
  .hero-visual{display:flex;justify-content:center;}
  @media(min-width:880px){
    .hero-grid{grid-template-columns:1.04fr .96fr;gap:60px;padding:4vh 0 6vh;}
    .landing-h1{font-size:clamp(52px,5.4vw,72px);}
    .hero-visual{justify-content:flex-end;}
  }
  /* hero live availability card */
  .hero-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 22px 18px;box-shadow:0 44px 88px -56px rgba(36,30,23,.55);}
  .hc-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px;}
  .hc-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--text);}
  .hc-avs{display:flex;}
  .hc-av{position:relative;overflow:hidden;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10.5px;font-weight:700;border:2px solid var(--card);margin-left:-8px;opacity:0;transform:scale(.4);transition:opacity .6s cubic-bezier(.22,1,.36,1),transform .6s cubic-bezier(.22,1,.36,1);}
  .av-face{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:50%;}
  .hc-av:first-child{margin-left:0;}
  .hc-av.in{opacity:1;transform:scale(1);}
  .hc-row{display:flex;align-items:center;gap:12px;padding:8px 0;}
  .hc-day{width:34px;flex:0 0 auto;font-size:13px;font-weight:600;color:var(--muted1);transition:color .6s,font-weight .6s;}
  .hc-track{flex:1;height:11px;border-radius:999px;background:#EAE1D0;overflow:hidden;}
  .hc-fill{display:block;height:100%;width:0;border-radius:999px;background:var(--accent);opacity:.4;transition:width .95s cubic-bezier(.22,1,.36,1),opacity .7s cubic-bezier(.16,1,.3,1);}
  .hc-row.lead .hc-fill{opacity:1;}
  .hc-row.win .hc-day{color:var(--text);font-weight:700;}
  .hc-tag{flex:0 0 auto;font-size:11.5px;font-weight:700;color:var(--accent);opacity:0;transform:translateX(-4px);transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1);}
  .hc-row.win .hc-tag{opacity:1;transform:none;}
  /* reminders opt-in modal */
  .ntf-card{background:var(--card);border-radius:24px;padding:26px 22px 22px;max-width:384px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 40px 90px -40px rgba(0,0,0,.5);}
  .ntf-h{font-family:'Space Grotesk',sans-serif;margin:0 0 6px;font-size:22px;font-weight:700;letter-spacing:-.02em;color:var(--text);}
  .ntf-sub{margin:0 0 20px;font-size:14px;line-height:1.5;color:var(--muted1);}
  .ntf-opt{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:#FDFCFA;border:1px solid var(--line);border-radius:15px;padding:13px 14px;margin-bottom:10px;cursor:pointer;transition:border-color .25s,background .25s;min-height:auto;}
  .ntf-opt:hover{border-color:var(--muted3);}
  .ntf-opt.on{border-color:var(--accent);background:var(--brand-soft);}
  .ntf-opt.disabled{opacity:.6;cursor:default;background:#FBF9F4;}
  .ntf-opt.disabled:hover{border-color:var(--line);}
  .ntf-soon{margin-left:auto;flex:0 0 auto;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted2);background:#ECE4D4;padding:3px 9px;border-radius:999px;}
  .ntf-ic{width:36px;height:36px;flex:0 0 auto;border-radius:11px;background:#EFE7D8;display:flex;align-items:center;justify-content:center;color:var(--accent-dark);transition:background .25s,color .25s;}
  .ntf-opt.on .ntf-ic{background:var(--accent);color:#fff;}
  .ntf-ic svg{width:18px;height:18px;}
  .ntf-txt{flex:1;min-width:0;}
  .ntf-t{display:block;font-weight:700;font-size:15px;color:var(--text);}
  .ntf-d{display:block;font-size:12.5px;color:var(--muted2);margin-top:1px;}
  .ntf-check{width:22px;height:22px;flex:0 0 auto;border-radius:50%;border:1.5px solid var(--muted3);display:flex;align-items:center;justify-content:center;transition:background .25s,border-color .25s;}
  .ntf-opt.on .ntf-check{background:var(--accent);border-color:var(--accent);}
  .ntf-check svg{width:12px;height:12px;opacity:0;transition:opacity .2s;}
  .ntf-opt.on .ntf-check svg{opacity:1;}
  .ntf-field{max-height:0;overflow:hidden;transition:max-height .3s cubic-bezier(.16,1,.3,1),margin .3s,opacity .25s;opacity:0;margin:0;}
  .ntf-field.show{max-height:70px;opacity:1;margin:-2px 0 12px;}
  .ntf-field input{width:100%;box-sizing:border-box;margin:0;}
  .ntf-actions{display:flex;gap:10px;margin-top:16px;}
  /* ===== product walkthrough — one continuous story ===== */
  html{overflow-x:hidden;}
  .walk{display:flex;flex-direction:column;}
  .scene{box-sizing:border-box;opacity:0;transform:translateY(28px);transition:opacity 1.15s cubic-bezier(.16,1,.3,1),transform 1.15s cubic-bezier(.16,1,.3,1);}
  .scene.in{opacity:1;transform:none;}
  .scene-lead{padding:clamp(53px,8.4vh,96px) 0;}
  .scene-kicker{font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.01em;margin:0 0 13px;}
  .scene-h{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:clamp(27px,7.2vw,34px);letter-spacing:-.032em;line-height:1.07;color:var(--text);margin:0 0 15px;max-width:15ch;}
  .scene-p{font-size:16.5px;line-height:1.5;color:var(--muted1);max-width:29ch;margin:0;}
  .scene-cap{font-size:15px;line-height:1.5;color:var(--muted2);margin:28px 0 0;font-weight:500;}
  /* scene 1 — create (light card) */
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px 20px;margin-top:34px;box-shadow:0 24px 56px -48px rgba(36,30,23,.4);}
  .pc-label{font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted2);margin:0 0 8px;}
  .pc-input{background:#FDFCFA;border:1px solid var(--line);border-radius:13px;padding:13px 15px;font-size:15.5px;font-weight:600;color:var(--text);margin-bottom:18px;display:flex;align-items:center;}
  .pc-typed{white-space:pre;}
  .pc-caret{display:inline-block;width:2px;height:19px;background:var(--accent);margin-left:2px;border-radius:1px;opacity:0;}
  .pc-caret.on{animation:caretBlink 1.05s steps(1,end) infinite;}
  @keyframes caretBlink{0%,49%{opacity:1;}50%,100%{opacity:0;}}
  .pc-days{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;}
  .pc-chip{padding:9px 13px;border-radius:11px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted1);background:#FFFFFF;transition:background .6s cubic-bezier(.16,1,.3,1),border-color .6s,color .6s;}
  .pc-chip.on{background:var(--brand-soft);border-color:var(--accent);color:var(--accent-dark);}
  .pc-people{display:flex;align-items:center;gap:8px;margin-bottom:20px;}
  .pc-person{position:relative;overflow:hidden;width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;border:2px solid var(--card);opacity:0;transform:scale(.4);transition:opacity .5s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.22,1,.36,1);}
  .pc-person.in{opacity:1;transform:scale(1);}
  .pc-add{width:34px;height:34px;flex:0 0 auto;border-radius:50%;border:1.5px dashed var(--muted3);color:var(--muted2);display:inline-flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;line-height:1;opacity:0;transform:scale(.4);transition:opacity .5s cubic-bezier(.22,1,.36,1),transform .5s cubic-bezier(.22,1,.36,1);}
  .pc-add.in{opacity:1;transform:scale(1);}
  .pc-btn{background:var(--accent);color:#FBF7EE;font-weight:700;font-size:15px;text-align:center;padding:13px;border-radius:13px;transition:transform .35s cubic-bezier(.16,1,.3,1),background .3s;}
  .pc-btn.press{transform:scale(.96);background:var(--accent-dark);}
  .pc-link{display:flex;align-items:center;gap:9px;background:#FDFCFA;border:1px dashed var(--line);border-radius:12px;padding:0 13px;margin-top:0;max-height:0;opacity:0;overflow:hidden;transition:max-height .5s cubic-bezier(.16,1,.3,1),opacity .4s ease,padding .4s,margin .4s;}
  .pc-link.show{max-height:60px;padding:11px 13px;margin-top:12px;opacity:1;}
  .pc-link .bub-mark{color:var(--accent-dark);flex:0 0 auto;}
  .pc-link-url{flex:1;min-width:0;font-size:13.5px;font-weight:600;color:var(--muted1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pc-link-copy{flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--accent);transition:color .3s,transform .2s cubic-bezier(.16,1,.3,1);}
  .pc-link-copy.click{transform:scale(.86);}
  .pc-link-copy.done{color:#4A9166;}
  /* scene 2 — share (message thread, no card) */
  .thread{display:flex;flex-direction:column;gap:9px;margin-top:36px;}
  .bub{max-width:80%;padding:11px 15px;font-size:15px;line-height:1.4;border-radius:20px;opacity:0;transform:translateY(13px);transition:opacity .75s cubic-bezier(.16,1,.3,1),transform .75s cubic-bezier(.16,1,.3,1);}
  .bub.in{opacity:1;transform:none;}
  .bub.them{align-self:flex-start;background:var(--card);border:1px solid var(--line);color:var(--text);border-bottom-left-radius:7px;}
  .bub.me{align-self:flex-end;background:var(--accent);color:#FBF7EE;border-bottom-right-radius:7px;}
  .bub.link{align-self:flex-end;background:var(--card);border:1px solid var(--line);color:var(--accent-dark);font-weight:600;display:inline-flex;align-items:center;gap:9px;box-shadow:0 18px 38px -32px rgba(36,30,23,.55);}
  .bub-mark{width:16px;height:16px;flex:0 0 auto;}
  /* link preview — the actual generated banner, as it renders in a chat */
  .bub.bub-preview{align-self:flex-end;background:transparent;padding:0;border-radius:16px;max-width:48%;box-shadow:0 16px 34px -26px rgba(36,30,23,.55);}
  .bub.bub-preview .sp-msg{width:100%;}
  .sp.sp-demo{cursor:default;}
  .sp.sp-demo .sp-h{font-size:17px;line-height:1.05;}
  .sp.sp-demo .sp-name{font-size:10px;}
  .sp.sp-demo .sp-l{padding:12px 13px;}
  .sp.sp-demo .sp-lock{bottom:7px;right:7px;gap:4px;}
  .sp.sp-demo .sp-lock svg{width:11px;height:11px;}
  .sp.sp-demo .sp-lock span{font-size:8px;}
  .bub.bub-preview .sp-foot{padding:7px 10px;}
  .bub.bub-preview .sp-foot .t{font-size:9px;}
  .bub.bub-preview .sp-foot .u{font-size:7.5px;margin-top:1px;}
  .bub.linkcard{align-self:flex-end;background:#ECE7DC;padding:11px 13px;border-radius:16px;border-bottom-right-radius:6px;display:flex;align-items:center;gap:13px;max-width:84%;}
  .lc-text{flex:1;min-width:0;}
  .lc-title{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;color:var(--text);line-height:1.15;}
  .lc-sub{font-size:12.5px;color:var(--muted1);line-height:1.3;margin-top:3px;}
  .lc-url{font-size:12px;color:var(--muted2);margin-top:3px;}
  .lc-icon{flex:0 0 auto;width:46px;height:46px;border-radius:12px;overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .lc-icon svg{width:100%;height:100%;display:block;}
  /* scene 3 — responses (board, no card) */
  .vote-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px 18px;max-width:430px;margin:36px auto 0;box-shadow:0 30px 60px -46px rgba(44,37,25,.5);}

  .b-seg{flex:0 0 auto;width:0;height:100%;transition:width .9s cubic-bezier(.22,1,.36,1),opacity .7s cubic-bezier(.16,1,.3,1);}
  .b-pref{background:var(--pref);opacity:.64;}
  .b-free{background:var(--accent);opacity:.4;}

  .b-tag{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--accent);opacity:0;transform:translateX(-5px);transition:opacity .7s cubic-bezier(.16,1,.3,1),transform .7s cubic-bezier(.16,1,.3,1);}

  .b-flash{position:absolute;left:96px;top:-13px;font-size:11px;font-weight:700;letter-spacing:.01em;color:#fff;padding:3px 10px;border-radius:999px;white-space:nowrap;opacity:0;transform:translateY(5px);pointer-events:none;transition:opacity .45s ease,transform .55s cubic-bezier(.16,1,.3,1);}

  @keyframes glowPref{0%,100%{box-shadow:0 0 0 0 rgba(126,156,127,0);}35%{box-shadow:0 0 18px 3px rgba(126,156,127,.6);}}
  .site-foot{display:flex;align-items:center;justify-content:center;gap:9px;padding:26px 16px 30px;font-size:12.5px;color:var(--muted2);position:relative;z-index:5;opacity:0;transition:opacity .45s ease;}

  .site-foot a{color:var(--muted1);text-decoration:none;font-weight:500;}

function renderAuth(opts){
  opts = opts || {};

  const initialMode = mode;

        (isLogin ? 'New here? ' : 'Already have an account? ') +
        '<a href="#" id="authSwap" style="color:var(--accent);font-weight:700;">'+(isLogin ? 'Create an account' : 'Log in')+'</a>' +
      '</p>' +
      '</div>'
    );
    document.getElementById('authHome').onclick = function(e){ goHome(e); };
    document.getElementById('authSwap').onclick = function(e){ e.preventDefault(); mode = isLogin ? 'signup' : 'login'; paint(); };
    const emailEl = document.getElementById('authEmail');
    const passEl = document.getElementById('authPass');
    const btn = document.getElementById('authBtn');
    async function submit(){
      const email = emailEl.value.trim();
      const pass = passEl.value;
      const errEl = document.getElementById('authErr'); errEl.style.display = 'none';
      if (!email || !pass){ errEl.textContent = 'Enter your email and password.'; errEl.style.display = 'block'; return; }
      if (mode === 'signup' && pass.length < 6){ errEl.textContent = 'Password must be at least 6 characters.'; errEl.style.display = 'block'; return; }
      btn.disabled = true; btn.textContent = isLogin ? 'Logging in...' : 'Creating...';
      let res;
      try {
        res = (mode === 'login')
          ? await sb.auth.signInWithPassword({ email: email, password: pass })
          : await sb.auth.signUp({ email: email, password: pass });
      } catch(e){ res = { error: { message: 'Something went wrong. Try again.' } }; }
      if (res.error){
        errEl.textContent = res.error.message || 'Something went wrong. Try again.';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = isLogin ? 'Log in' : 'Create account';
        return;
      }
      await refreshUser();
      if (!currentUser){
        errEl.textContent = 'Check your email to confirm your account, then log in.';
        errEl.style.display = 'block';
        mode = 'login';
        btn.disabled = false; btn.textContent = 'Log in';
        return;
      }
      if (opts.next) opts.next(); else route();
    }
    btn.onclick = submit;
    passEl.onkeydown = function(e){ if (e.key === 'Enter') submit(); };
  }
  paint();

let toastTimer = null;
function showToast(msg, duration){
  let el = document.getElementById('swfToast');
  if (!el){
    el = document.createElement('div');
    el.id = 'swfToast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); }, duration || 1700);
}

async function sharePlan(plan, btn){
  const url = planUrl(plan);
  if (navigator.share){
    try {
      await navigator.share({ title: plan.title, text: 'Which day works best? Add when you’re free:', url: url });
      markShared(plan);
      return;
    } catch(e){
      if (e && e.name === 'AbortError') return; // user closed the share sheet
      // otherwise fall through to copy
    }
  }
  try {
    await navigator.clipboard.writeText(url);
    markShared(plan);
    if (btn){ const orig = btn.textContent; btn.textContent = 'Link copied!'; setTimeout(function(){ btn.textContent = orig; }, 1600); }
  } catch(e){}
}

function burstSparkles(){ /* retired — convergence uses the gather, not confetti */ }
function elCenter(el){ const r = el.getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; }
// THE GATHER — a presence travels along a gentle arc into a possibility and settles.
function gatherDot(sx, sy, ex, ey, color){
  const dx = ex - sx, dy = ey - sy;
  const cx = (sx + ex) / 2 - dy * 0.22;
  const cy = (sy + ey) / 2 + dx * 0.22 - 18;
  const el = document.createElement('div');
  el.className = 'gather-dot';
  el.style.background = color || 'var(--pref)';
  el.style.offsetPath = "path('M " + sx + " " + sy + " Q " + cx + " " + cy + " " + ex + " " + ey + "')";
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 620);
}
// On submit, the view settles gently into the results — a quiet fade, no drawn flourish.
function threadTransition(startEl, color, done){
  app.style.transition = 'opacity .4s cubic-bezier(.22,1,.36,1)';
  app.style.opacity = '0';
  setTimeout(() => { app.style.opacity = ''; app.style.transition = ''; done(); }, 400);
}

function wirePasscodeLogin(){
  const btn = document.getElementById('findBtn');
  if (!btn) return;
  btn.onclick = async () => {
    const code = document.getElementById('findPasscode').value.trim();
    const errEl = document.getElementById('findErr'); errEl.style.display = 'none';
    if (!code){ errEl.textContent = 'Enter a passcode.'; errEl.style.display = 'block'; return; }
    btn.disabled = true; btn.textContent = 'Searching...';
    const { data, error } = await sb.rpc('find_plans_by_passcode', { p_passcode: code });
    btn.disabled = false; btn.textContent = 'Find my plans';
    if (error){ errEl.textContent = 'Something went wrong. Try again.'; errEl.style.display = 'block'; return; }
    if (!data || data.length === 0){ errEl.textContent = 'No plans found for that passcode.'; errEl.style.display = 'block'; return; }
    data.forEach(p => { unlockAdmin(p.plan_id); setPass(p.plan_id, code); addMyEvent({ id: p.plan_id, title: p.title }); });
    if (data.length === 1){ window.location.href = '?plan=' + data[0].plan_id + '&admin=1'; return; }
    renderMyEvents();
  };
}

async function renderMyEvents(){
  render('');
  const createHref = window.location.pathname + '?new=1';
  const plans = [];
  const respRows = [];
  const seen = {};
  // account-owned plans (the primary source once logged in)
  if (currentUser){
    const { data: owned } = await sb.rpc('get_my_owned_plans');
    ((owned && owned.plans) || []).forEach(p => { if (!seen[p.id]){ seen[p.id] = 1; plans.push(p); } });
    ((owned && owned.responders) || []).forEach(r => respRows.push(r));
  }
  // legacy plans saved on this device (created before accounts / via passcode)
  const stored = getMyEvents();
  const legacyIds = stored.map(e => e.id).filter(id => !seen[id]);
  if (legacyIds.length){
    const { data: bundle } = await sb.rpc('get_my_plans', { p_ids: legacyIds });
    ((bundle && bundle.plans) || []).forEach(p => { if (!seen[p.id]){ seen[p.id] = 1; plans.push(p); } });
    ((bundle && bundle.responders) || []).forEach(r => respRows.push(r));
  }
  function accountRowHtml(){
    if (currentUser){
      const email = (currentUser.email || '').trim();
      return '<div style="display:flex;align-items:center;justify-content:center;gap:8px;margin-top:34px;font-size:13.5px;color:var(--muted1);">' +
        '<span>'+(email ? escapeHtml(email) : 'Logged in')+'</span><span>·</span>' +
        '<a href="#" id="logoutLink" style="color:var(--accent);font-weight:600;">Log out</a></div>';
    }
    return '';
  }
  function wireAccountRow(){
    const lo = document.getElementById('logoutLink');
    if (lo) lo.onclick = function(e){ e.preventDefault(); signOutAndHome(); };
  }
  if (plans.length === 0){
    render(
      '<div class="brandHome" style="display:flex;align-items:center;gap:9px;margin:2px 0 8px;">' +
      logoMarkSvg(32) + wordmarkHtml(22,'#2C2519','#2C2519') +
      '</div>' +
      '<div class="home-empty">' +
      '<span class="home-empty-mark">'+logoMarkSvg(56)+'</span>' +
      '<h2 style="margin:16px 0 6px;">'+(currentUser ? 'No plans yet' : 'Your plans live in your account')+'</h2>' +
      '<p class="muted" style="font-size:15px;margin:0 auto 22px;max-width:290px;">'+(currentUser ? 'Start something — pick a few days, share a link, and watch everyone land on one.' : 'Log in to see the plans you\'ve created, or start a new one.')+'</p>' +
      (currentUser ? '' : '<a class="btn-primary" href="#" id="loginBtn" style="max-width:220px;margin:0 auto 12px;text-decoration:none;text-align:center;display:block;">Log in</a>') +
      '<a class="create-pill" href="'+createHref+'" style="margin:0 auto;">+ New plan</a>' +
      '</div>' +
      accountRowHtml()
    );
    const lb = document.getElementById('loginBtn');
    if (lb) lb.onclick = function(e){ e.preventDefault(); renderAuth({ mode:'login', next:function(){ renderMyEvents(); } }); };
    wireAccountRow();
    return;
  }
  const responders = {};
  respRows.forEach(r => { (responders[r.plan_id] = responders[r.plan_id] || new Set()).add(r.friend_id); });
  const todayIso = new Date().toISOString().slice(0,10);
  const groups = { upcoming: [], draft: [], past: [] };
  plans.forEach(p => {
    const respCount = responders[p.id] ? responders[p.id].size : 0;
    let state, section;
    if (p.decided_date){
      if (p.decided_date >= todayIso){ state = 'set'; section = 'upcoming'; }
      else { state = 'past'; section = 'past'; }
    }
    else if (respCount > 0){ state = 'gathering'; section = 'upcoming'; }
    else if (p.shared_at){ state = 'inprogress'; section = 'upcoming'; }
    else { state = 'draft'; section = 'draft'; }
    groups[section].push({ p: p, respCount: respCount, state: state });
  });
  function metaFor(it){
    const p = it.p;
    if (p.decided_date) return (it.state === 'past' ? 'Was ' : '') + fmtDateShort(p.decided_date);
    if (it.state === 'draft') return 'Not shared yet';
    if (it.state === 'inprogress') return 'Waiting for replies';
    return it.respCount + ' ' + (it.respCount === 1 ? 'person' : 'people') + ' in so far';
  }
  function chipFor(it){
    if (it.state === 'past') return '<span class="plan-chip past">Wrapped</span>';
    if (it.state === 'set') return '<span class="plan-chip set">Set</span>';
    if (it.state === 'draft') return '<span class="plan-chip draft">Draft</span>';
    if (it.state === 'inprogress') return '<span class="plan-chip prog">In progress</span>';
    return '<span class="plan-chip live">Gathering</span>';
  }
  function cardFor(it, key){
    const p = it.p;
    const cover = p.cover_photo_url
      ? '<div class="plan-cover" style="background-image:linear-gradient(to top,rgba(24,16,6,.32),rgba(24,16,6,0) 62%),url(\''+p.cover_photo_url+'\');"></div>'
      : '<div class="plan-cover noimg">'+logoMarkSvg(30)+'</div>';
    const loc = p.location ? '<span>'+escapeHtml(p.location)+'</span> · ' : '';
    return '<a class="plan-card'+(it.state === 'past' ? ' faded' : '')+'" href="?plan='+p.id+'&admin=1">' +
      cover +
      '<div class="plan-cardbody"><div class="plan-title">'+escapeHtml(p.title)+'</div>' +
      '<div class="plan-meta">'+loc+metaFor(it)+'</div></div>' +
      chipFor(it) +
      '</a>';
  }
  function sectionFor(title, key){
    if (!groups[key].length) return '';
    return '<p class="plan-section">'+title+'</p>' + groups[key].map(it => cardFor(it, key)).join('');
  }
  render(
    '<div class="brandHome" style="display:flex;align-items:center;gap:9px;margin:2px 0 20px;">' +
    logoMarkSvg(32) +
    wordmarkHtml(22,'#2C2519','#2C2519') +
    '</div>' +
    '<div style="display:flex;align-items:center;justify-content:space-between;gap:14px;margin:0 0 24px;">' +
    '<h1 class="admin-hdr" style="margin:0;">Your plans</h1>' +
    '<a class="create-pill" href="'+createHref+'">+ New plan</a>' +
    '</div>' +
    sectionFor('Upcoming', 'upcoming') +
    sectionFor('Drafts', 'draft') +
    sectionFor('Past', 'past') +
    accountRowHtml()
  );
  wireAccountRow();
}

function wireHeroCard(){
  const card = document.querySelector('.hero-card');
  if (!card) return;
  const avs = card.querySelectorAll('.hc-av');
  const rows = card.querySelectorAll('.hc-row');
  const fills = card.querySelectorAll('.hc-fill');
  // availability resolving as answers arrive; Saturday quietly wins [Fri,Sat,Sun]
  const steps = [
    { w:[20,20,0],  lead:[0,0,0] },
    { w:[40,40,0],  lead:[0,0,0] },
    { w:[40,60,20], lead:[0,1,0] },
    { w:[60,60,40], lead:[0,0,0] },
    { w:[60,80,40], lead:[0,1,0] }
  ];
  let timers = [];
  function reset(){
    avs.forEach(function(a){ a.classList.remove('in'); });
    fills.forEach(function(f){ f.style.width = '0%'; });
    rows.forEach(function(r){ r.classList.remove('lead','win'); });
  }
  function inView(){
    const r = card.getBoundingClientRect();
    return r.bottom > 0 && r.top < window.innerHeight;
  }
  function play(){
    timers.forEach(clearTimeout); timers = [];
    reset();
    steps.forEach(function(step, i){
      timers.push(setTimeout(function(){
        if (avs[i]) avs[i].classList.add('in');
        step.w.forEach(function(w, di){ if (fills[di]) fills[di].style.width = w + '%'; });
        step.lead.forEach(function(l, di){ if (rows[di]){ if (l) rows[di].classList.add('lead'); else rows[di].classList.remove('lead'); } });
      }, 600 + i*820));
    });
    timers.push(setTimeout(function(){ if (rows[1]) rows[1].classList.add('win'); }, 600 + 5*820 + 300));
    timers.push(setTimeout(function(){ if (inView()) play(); else waitForView(); }, 600 + 5*820 + 3200));
  }
  function waitForView(){ timers.push(setTimeout(function(){ if (inView()) play(); else waitForView(); }, 1400)); }
  play();
}

function wireWalk(){
  const scenes = document.querySelectorAll('.scene');
  if (!scenes.length) return;
  const played = {};
  // a scene keeps animating as long as it's on screen; it quietly waits when it isn't
  function sceneInView(sec){ const r = sec.getBoundingClientRect(); return r.top < window.innerHeight * 0.9 && r.bottom > window.innerHeight * 0.1; }
  function playCreate(sec){
    const typed = sec.querySelector('.pc-typed');
    const caret = sec.querySelector('.pc-caret');
    const chips = sec.querySelectorAll('.pc-chip');
    const people = sec.querySelectorAll('.pc-people > *'); // faces, then the "+" appears last
    const btn = sec.querySelector('.pc-btn');
    const link = sec.querySelector('.pc-link');
    const copy = sec.querySelector('.pc-link-copy');
    const text = 'Cabin weekend';
    let timers = [];
    function reset(){
      if (typed) typed.textContent = ''; if (caret) caret.classList.remove('on');
      chips.forEach(function(c){ c.classList.remove('on'); });
      people.forEach(function(p){ p.classList.remove('in'); });
      if (btn) btn.classList.remove('press');
      if (link) link.classList.remove('show');
      if (copy){ copy.textContent = 'Copy'; copy.classList.remove('click','done'); }
    }
    function play(){
      timers.forEach(clearTimeout); timers = []; reset();
      if (caret) caret.classList.add('on');
      let i = 0;
      function type(){
        if (i <= text.length){ if (typed) typed.textContent = text.slice(0, i); i++; timers.push(setTimeout(type, 82)); }
        else {
          timers.push(setTimeout(function(){ if (caret) caret.classList.remove('on'); }, 700));
          [0,1,2].forEach(function(idx, k){ timers.push(setTimeout(function(){ if (chips[idx]) chips[idx].classList.add('on'); }, 300 + k*300)); });
          people.forEach(function(p, k){ timers.push(setTimeout(function(){ p.classList.add('in'); }, 1250 + k*220)); });
          // create plan gets pressed, then the shareable link appears and is copied
          timers.push(setTimeout(function(){ if (btn) btn.classList.add('press'); }, 2650));
          timers.push(setTimeout(function(){ if (btn) btn.classList.remove('press'); if (link) link.classList.add('show'); }, 2950));
          timers.push(setTimeout(function(){ if (copy) copy.classList.add('click'); }, 3900));
          timers.push(setTimeout(function(){ if (copy){ copy.classList.remove('click'); copy.textContent = 'Copied'; copy.classList.add('done'); } }, 4060));
        }
      }
      timers.push(setTimeout(type, 480));
      timers.push(setTimeout(function(){ if (sceneInView(sec)) play(); else waitFor(); }, 9000));
    }
    function waitFor(){ timers.push(setTimeout(function(){ if (sceneInView(sec)) play(); else waitFor(); }, 1400)); }
    play();
  }
  function playShare(sec){
    const bubs = sec.querySelectorAll('.bub');
    let timers = [];
    function play(){
      timers.forEach(clearTimeout); timers = [];
      bubs.forEach(function(b){ b.classList.remove('in'); });
      bubs.forEach(function(b, i){ timers.push(setTimeout(function(){ b.classList.add('in'); }, 400 + i*640)); });
      const done = 400 + bubs.length*640;
      timers.push(setTimeout(function(){ if (sceneInView(sec)) play(); else waitFor(); }, done + 3800));
    }
    function waitFor(){ timers.push(setTimeout(function(){ if (sceneInView(sec)) play(); else waitFor(); }, 1400)); }
    play();
  }
  function playAnswer(sec){
    const avs = sec.querySelectorAll('.b-av');
    const rows = sec.querySelectorAll('.b-row');
    const prefs = sec.querySelectorAll('.b-pref');
    const frees = sec.querySelectorAll('.b-free');
    const nos = sec.querySelectorAll('.b-no');
    const flashes = sec.querySelectorAll('.b-flash');
    const confirm = sec.querySelector('.b-confirm');
    const confirmBtn = sec.querySelector('.b-confirm-btn');
    // One plan, five people — and EVERYONE answers EVERY day, so all three bars grow to
    // the same total length (5 people x 20% = 100%). A day stands out by its make-up, not
    // its length: preferred (green) then free (teal) then can't (red), flush left-to-right.
    // Saturday is best because it collects the preferred votes and no can'ts; Sunday is the
    // only day anyone can't do. pf/fr/no are cumulative % widths for [Fri, Sat, Sun].
    // Per person: Carly Sat-pref, Jess Sat-pref; Trevor & Jordan can't Sunday; rest free.
    const steps = [
      { pf:[0,20,0], fr:[20,0,20],  no:[0,0,0],  lead:[0,0,0], flash:{i:1,t:'pref'} }, // Carly stars Saturday
      { pf:[0,20,0], fr:[40,20,20], no:[0,0,20], lead:[0,0,0], flash:{i:2,t:'no'} },   // Trevor can't do Sunday
      { pf:[0,40,0], fr:[60,20,40], no:[0,0,20], lead:[0,1,0], flash:null },            // Jess stars Saturday too
      { pf:[0,40,0], fr:[80,40,40], no:[0,0,40], lead:[0,0,0], flash:null },            // Jordan out on Sunday
      { pf:[0,40,0], fr:[100,60,60],no:[0,0,40], lead:[0,1,0], flash:null }             // Maya free everywhere — Saturday's green pulls it clear
    ];
    const CONFIRM_LABEL = 'Confirm Saturday, Aug 9';
    let timers = [];
    function reset(){
      avs.forEach(function(a){ a.classList.remove('in'); });
      prefs.forEach(function(f){ f.style.width = '0%'; });
      frees.forEach(function(f){ f.style.width = '0%'; });
      nos.forEach(function(f){ f.style.width = '0%'; });
      rows.forEach(function(r){ r.classList.remove('lead'); r.classList.remove('win'); });
      flashes.forEach(function(f){ f.classList.remove('show','no','pref'); });
      if (confirm) confirm.classList.remove('show','press','done');
      if (confirmBtn) confirmBtn.textContent = CONFIRM_LABEL;
    }
    function showFlash(idx, type){
      const fl = flashes[idx]; if (!fl) return;
      fl.textContent = type === 'no' ? 'Can’t do' : 'Preferred date';
      fl.classList.remove('no','pref'); fl.classList.add(type, 'show');
      timers.push(setTimeout(function(){ fl.classList.remove('show'); }, 1400));
    }
    function inView(){
      const r = sec.getBoundingClientRect();
      return r.top < window.innerHeight * 0.85 && r.bottom > window.innerHeight * 0.15;
    }
    function play(){
      timers.forEach(clearTimeout); timers = [];
      reset();
      steps.forEach(function(step, i){
        timers.push(setTimeout(function(){
          if (avs[i]) avs[i].classList.add('in');
          step.pf.forEach(function(w, di){ if (prefs[di]) prefs[di].style.width = w + '%'; });
          step.fr.forEach(function(w, di){ if (frees[di]) frees[di].style.width = w + '%'; });
          step.no.forEach(function(w, di){ if (nos[di]) nos[di].style.width = w + '%'; });
          step.lead.forEach(function(l, di){ if (rows[di]){ if (l) rows[di].classList.add('lead'); else rows[di].classList.remove('lead'); } });
          if (step.flash) showFlash(step.flash.i, step.flash.t);
        }, 500 + i*950));
      });
      const winAt = 500 + 5*950 + 350;
      timers.push(setTimeout(function(){ if (rows[1]) rows[1].classList.add('win'); showFlash(1, 'pref'); }, winAt));
      // the organizer locks it in
      timers.push(setTimeout(function(){ if (confirm) confirm.classList.add('show'); }, winAt + 700));
      timers.push(setTimeout(function(){ if (confirm) confirm.classList.add('press'); }, winAt + 1700));
      timers.push(setTimeout(function(){ if (confirm){ confirm.classList.remove('press'); confirm.classList.add('done'); } if (confirmBtn) confirmBtn.textContent = '✓ Saturday, Aug 9 — locked in'; }, winAt + 2050));
      // hold on the result, then quietly replay while in view
      timers.push(setTimeout(function(){ if (inView()) play(); else waitForView(); }, winAt + 5200));
    }
    function waitForView(){
      timers.push(setTimeout(function(){ if (inView()) play(); else waitForView(); }, 1400));
    }
    play();
  }
  function playVote(sec){
    const rows = sec.querySelectorAll('.vt-row');
    const submit = sec.querySelector('.vt-submit-btn');
    const picks = ['free','top','no']; // Fri free, Sat top, Sun can't
    let timers = [];
    function reset(){
      rows.forEach(function(r){ r.querySelectorAll('.vt-opt').forEach(function(o){ o.classList.remove('on','tap'); }); });
      if (submit){ submit.classList.remove('press','done'); submit.textContent = 'Submit'; }
    }
    function play(){
      timers.forEach(clearTimeout); timers = []; reset();
      rows.forEach(function(r, i){
        timers.push(setTimeout(function(){
          const opt = r.querySelector('.vt-opt.' + picks[i]);
          if (opt){ opt.classList.add('on', 'tap'); }
        }, 750 + i*780));
      });
      const submitAt = 750 + rows.length*780 + 450;
      timers.push(setTimeout(function(){ if (submit) submit.classList.add('press'); }, submitAt));
      timers.push(setTimeout(function(){ if (submit){ submit.classList.remove('press'); submit.classList.add('done'); submit.textContent = 'Submitted ✓'; } }, submitAt + 320));
      timers.push(setTimeout(function(){ if (sceneInView(sec)) play(); else waitFor(); }, submitAt + 3800));
    }
    function waitFor(){ timers.push(setTimeout(function(){ if (sceneInView(sec)) play(); else waitFor(); }, 1400)); }
    play();
  }
  function playTogether(sec){
    const ppl = sec.querySelectorAll('.fp');
    const eyebrow = sec.querySelector('.final-eyebrow');
    const date = sec.querySelector('.final-date');
    const note = sec.querySelector('.final-note');
    const cta = sec.querySelector('.final-cta');
    let timers = [];
    const at = function(ms, fn){ timers.push(setTimeout(fn, ms)); };
    function play(){
      timers.forEach(clearTimeout); timers = [];
      ppl.forEach(function(p){ p.classList.remove('in'); });
      [eyebrow, date, note, cta].forEach(function(el){ if (el) el.classList.remove('show'); });
      if (cta) cta.classList.remove('tap');
      // Beat 1: "Everyone answered" + the date + the FIRST person, together
      at(300, function(){
        if (eyebrow) eyebrow.classList.add('show');
        if (date) date.classList.add('show');
        if (ppl[0]) ppl[0].classList.add('in');
      });
      // Beat 2: the rest of the people, one by one
      let t = 300 + 750;
      for (let i = 1; i < ppl.length; i++){
        (function(idx, when){ at(when, function(){ ppl[idx].classList.add('in'); }); })(i, t);
        t += 360;
      }
      // Beat 3: "See you Saturday", then the button appears and gets an animated tap
      const noteAt = t + 350;
      at(noteAt, function(){ if (note) note.classList.add('show'); });
      const ctaAt = noteAt + 550;
      at(ctaAt, function(){ if (cta) cta.classList.add('show'); });
      const tapAt = ctaAt + 800;
      at(tapAt, function(){ if (cta) cta.classList.add('tap'); });
      at(tapAt + 560, function(){ if (cta) cta.classList.remove('tap'); });
      at(tapAt + 560 + 2600, function(){ if (sceneInView(sec)) play(); else waitFor(); });
    }
    function waitFor(){ at(1400, function(){ if (sceneInView(sec)) play(); else waitFor(); }); }
    play();
  }
  const runners = { create:playCreate, share:playShare, vote:playVote, answer:playAnswer, together:playTogether };
  try {
    const io = new IntersectionObserver(function(ents){
      ents.forEach(function(e){
        if (!e.isIntersecting) return;
        const sec = e.target;
        sec.classList.add('in');
        const key = sec.getAttribute('data-scene');
        if (key && runners[key] && !played[key]){ played[key] = true; runners[key](sec); }
      });
    }, { threshold: 0.3 });
    scenes.forEach(function(s){ io.observe(s); });
  } catch(e){
    scenes.forEach(function(s){
      s.classList.add('in');
      const key = s.getAttribute('data-scene');
      if (key && runners[key]) runners[key](s);
    });
  }
}

async function route(){
  const planId = planIdFromUrl();
  const admin = qs().get('admin') === '1';
  const forceNew = qs().get('new') === '1';
  const welcome = qs().get('welcome') === '1';
  if (!planId){
    if (welcome){ renderLanding(); return; }
    if (forceNew){ renderCreate(); return; }
    if (admin){
      if (!currentUser){ renderAuth({ mode:'login', heading:'Log in', blurb:'Log in to see and manage your plans.', next:function(){ history.replaceState(null,'',location.pathname+'?admin=1'); renderMyEvents(); } }); return; }
      renderMyEvents(); return;
    }
    if (currentUser){ renderMyEvents(); return; }
    if (getMyEvents().length > 0){ renderMyEvents(); return; }
    renderLanding(); return;
  }
  render('');
  const plan = await loadPlan(planId);
  if (!plan){
    render('<div class="card"><h2>Plan not found</h2><p class="muted">This link may be broken or the plan was deleted.</p><a class="top-link" href="'+window.location.pathname+'">&larr; Start a new plan</a></div>');
    return;
  }
  if (admin){ renderAdminGate(plan); return; }
  if (plan.decided_date){ renderDecided(plan); return; }
  const me = getMe(planId);
  if (!me){
    if (isOrganizer(planId)){ renderResults(plan); return; }
    renderWhoAreYou(plan); return;
  }
  const hasSubmitted = plan.dayResponses.some(r => r.friend_id === me.id);
  logActivity(plan.id, me, 'viewed', hasSubmitted ? 'Viewed results' : 'Viewed their days');
  if (hasSubmitted){
    renderResults(plan);
    const newDates = plan.candidateDates.filter(d => !isEliminated(plan, d) && !plan.dayResponses.some(r => r.friend_id === me.id && r.date === d)).sort();
    if (newDates.length) showNewDaysPromptModal(plan, me, newDates);
  } else { renderDayPicker(plan, me); }
}

function showNewDaysPromptModal(plan, me, newDates){
  const overlay = document.createElement('div');
  overlay.id = 'newDaysPromptOverlay';
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(26,24,22,0.55);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;';
  overlay.innerHTML = '<div style="background:#FFFFFF;border-radius:20px;padding:26px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,0.25);">' +
    '<h2 style="margin:0 0 10px;font-size:19px;">New '+(newDates.length===1?'day':'days')+' added!</h2>' +
    '<p class="muted" style="margin:0 0 18px;">The organizer added '+(newDates.length===1?'a new option' : (newDates.length+' new options'))+'. Please also answer for: '+newDates.map(fmtDateShort).join(', ')+'.</p>' +
    '<button class="btn-primary" id="newDaysPromptGo" style="margin-bottom:8px;">Answer now</button>' +
    '<button class="btn-secondary" id="newDaysPromptLater">Later</button>' +
    '</div>';
  document.body.appendChild(overlay);
  document.getElementById('newDaysPromptGo').onclick = () => { overlay.remove(); renderDayPicker(plan, me); };
  document.getElementById('newDaysPromptLater').onclick = () => { overlay.remove(); };
}

function renderDecided(plan){
  const dd = new Date(plan.decided_date+'T00:00:00');
  const big = dd.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  const note = plan.decided_note ? escapeHtml(plan.decided_note) : "It’s on.";
  const cover = plan.cover_photo_url || DEFAULT_COVER;
  const fr = plan.friends.slice(0,8);

// ---- Calendar invite (.ics + Google Calendar), client-side, all-day event ----
function pad2(n){ return (n<10?'0':'')+n; }
function icsStamp(dt){ return dt.getUTCFullYear()+pad2(dt.getUTCMonth()+1)+pad2(dt.getUTCDate())+'T'+pad2(dt.getUTCHours())+pad2(dt.getUTCMinutes())+pad2(dt.getUTCSeconds())+'Z'; }
function ymdCompact(iso){ return String(iso||'').replace(/-/g,''); }
function nextDayCompact(iso){ const d=new Date(iso+'T00:00:00'); d.setDate(d.getDate()+1); return d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate()); }
function icsEscape(s){ return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }
// Parse a freeform time label (e.g. "6pm", "2:00 - 6:00 PM", "18:00-22:00") into
// start/end minutes. Returns null when it's too ambiguous (then we use an all-day event).
function parseTimeRange(label){
  if (!label) return null;
  const s = String(label).toLowerCase();
  const re = /(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)?/g;
  const toks = []; let m;
  while ((m = re.exec(s))){
    if (m[1] === undefined) continue;
    toks.push({ h: parseInt(m[1],10), min: m[2] ? parseInt(m[2],10) : 0, mer: m[3] ? (m[3][0]==='p'?'pm':'am') : null, hadColon: !!m[2] });
    if (toks.length >= 2) break;
  }
  if (!toks.length) return null;
  if (toks[1] && toks[1].mer && !toks[0].mer) toks[0].mer = toks[1].mer; // "7-9pm" -> both pm
  function resolve(t){
    if (t.mer === 'pm') return (t.h % 12) + 12 + t.min/60;
    if (t.mer === 'am') return (t.h % 12) + t.min/60;
    if (t.h > 12 || (t.hadColon && t.h <= 23)) return t.h + t.min/60; // 24h
    return null; // ambiguous
  }
  const sH = resolve(toks[0]);
  if (sH === null) return null;
  let sMin = Math.round(sH * 60);
  let eMin = toks[1] && resolve(toks[1]) !== null ? Math.round(resolve(toks[1]) * 60) : sMin + 120;
  if (eMin <= sMin) eMin = sMin + 120;
  if (eMin > 1439) eMin = 1439;
  return { sh: Math.floor(sMin/60), sm: sMin%60, eh: Math.floor(eMin/60), em: eMin%60 };
}
function eventCalData(plan){
  const title = plan.title || 'Whensday plan';
  const loc = plan.location || '';
  const t = parseTimeRange(plan.time_label);
  const ymd = ymdCompact(plan.decided_date);
  const descParts = [];
  if (!t && plan.time_label) descParts.push('Time: '+plan.time_label);
  if (plan.decided_note) descParts.push(plan.decided_note);
  descParts.push('Planned with Whensday');
  const desc = descParts.join('\n');
  if (t){
    return { title, loc, desc, allDay:false,
      start: ymd+'T'+pad2(t.sh)+pad2(t.sm)+'00',
      end:   ymd+'T'+pad2(t.eh)+pad2(t.em)+'00' };
  }
  return { title, loc, desc, allDay:true, startYmd: ymd, endYmd: nextDayCompact(plan.decided_date) };
}
function buildIcs(plan){
  const e = eventCalData(plan);
  const dt = e.allDay
    ? ['DTSTART;VALUE=DATE:'+e.startYmd,'DTEND;VALUE=DATE:'+e.endYmd]
    : ['DTSTART:'+e.start,'DTEND:'+e.end];
  const lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Whensday//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
    'BEGIN:VEVENT','UID:'+((plan.id||'evt')+'@whensday'),'DTSTAMP:'+icsStamp(new Date())]
    .concat(dt)
    .concat(['SUMMARY:'+icsEscape(e.title),'LOCATION:'+icsEscape(e.loc),'DESCRIPTION:'+icsEscape(e.desc),'END:VEVENT','END:VCALENDAR']);
  return lines.join('\r\n');
}
function downloadIcs(plan){
  try {
    const blob = new Blob([buildIcs(plan)], { type:'text/calendar;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = (slugify(plan.title||'whensday')||'whensday')+'.ics';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1500);
  } catch(e){}
}
function googleCalUrl(plan){
  const e = eventCalData(plan);
  const dates = e.allDay ? (e.startYmd+'/'+e.endYmd) : (e.start+'/'+e.end);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(e.title)+'&dates='+dates+'&details='+encodeURIComponent(e.desc)+(e.loc?'&location='+encodeURIComponent(e.loc):'');
}

async function loadPlan(planIdOrSlug){
  const { data: bundle, error } = await sb.rpc('get_plan_full', { p_key: String(planIdOrSlug) });
  if (error || !bundle || !bundle.plan) return null;
  const plan = bundle.plan;
  plan.has_passcode = !!bundle.has_passcode;
  plan.is_owned = !!bundle.is_owned;
  plan.am_owner = !!bundle.am_owner;
  const planId = plan.id;
  const history = bundle.history || [];
  plan.friends = bundle.friends || [];
  plan.dayResponses = bundle.dayResponses || [];
  plan.candidateDates = (plan.dates || []).slice().sort();
  const candidateSet = new Set(plan.candidateDates);
  // knownDates = only admin-approved candidate days. Ad-hoc dates someone answered
  // that aren't yet approved stay out of the shared calendar/results until an admin approves them.
  plan.knownDates = plan.candidateDates.slice();
  const pendingSet = new Set();
  plan.dayResponses.forEach(r => { if (!candidateSet.has(r.date)) pendingSet.add(r.date); });
  plan.pendingDates = Array.from(pendingSet).sort();
  plan.addedBy = {};
  (history || []).forEach(h => {
    if (!candidateSet.has(h.date) && !(h.date in plan.addedBy)) plan.addedBy[h.date] = h.friend_name;
  });
  return plan;
}

function friendNameById(plan, fid){
  const f = plan.friends.find(x => x.id === fid);
  return f ? f.name : 'Someone';
}

function namesListText(names){
  if (names.length === 0) return '';
  if (names.length === 1) return names[0];
  if (names.length === 2) return names[0] + ' and ' + names[1];
  return names.slice(0, -1).join(', ') + ', and ' + names[names.length - 1];
}

function prefSentence(names){
  if (!names.length) return '';
  const text = namesListText(names);
  const verb = names.length === 1 ? 'prefers' : 'prefer';
  return text + ' ' + verb + ' this day.';
}
function freeSentence(names){
  if (!names.length) return 'No one\'s free yet.';
  const text = namesListText(names);
  const verb = names.length === 1 ? 'is' : 'are';
  return text + ' ' + verb + ' free that day.';
}

function isEliminated(plan, d){
  const totalFriends = plan.friends.length;
  if (!totalFriends) return false;
  const noCount = plan.dayResponses.filter(r => r.date === d && r.state === 'no').length;
  return noCount > totalFriends / 2;
}

function computeTopPick(plan){
  const rows = plan.knownDates.map(d => {
    const resp = plan.dayResponses.filter(r => r.date === d);
    const freeNames = resp.filter(r => r.state === 'free').map(r => friendNameById(plan, r.friend_id));
    const prefNames = resp.filter(r => r.state === 'preferred').map(r => friendNameById(plan, r.friend_id));
    const noNames = resp.filter(r => r.state === 'no').map(r => friendNameById(plan, r.friend_id));
    return { date: d, freeNames, prefNames, noNames, score: freeNames.length + prefNames.length*2 - noNames.length*3, total: freeNames.length + prefNames.length + noNames.length };
  });
  const answered = rows.filter(r => r.total > 0);
  if (!answered.length) return null;
  const clean = answered.filter(r => r.noNames.length === 0);
  if (!clean.length) return { mode: 'none', tied: false, rows: [] };
  const withPref = clean.filter(r => r.prefNames.length > 0);
  const pool = withPref.length ? withPref : clean;
  const mode = withPref.length ? 'preferred' : 'free';
  function key(r){ return mode === 'preferred' ? [r.score, r.prefNames.length] : [r.freeNames.length, r.score]; }
  const sorted = pool.slice().sort((a,b) => { const ka=key(a), kb=key(b); return kb[0]-ka[0] || kb[1]-ka[1]; });
  const bestKey = key(sorted[0]);
  const tiedRows = sorted.filter(r => { const k = key(r); return k[0]===bestKey[0] && k[1]===bestKey[1]; });
  return { mode, tied: tiedRows.length > 1, rows: tiedRows };
}
