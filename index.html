      const inp = document.getElementById('whoName'); inp.focus();
      inp.onkeydown = function(e){ if (e.key === 'Enter'){ e.preventDefault(); commitWho(inp.value); } else if (e.key === 'Escape'){ whoAdding = false; renderWho(); } };
      inp.onblur = function(){ commitWho(inp.value); };
    } else {
      document.getElementById('whoAdd').onclick = function(){ whoAdding = true; renderWho(); };
    }
  }
  renderWho();
  const dates = [];
  const today = new Date();
  let calYear = today.getFullYear(), calMonth = today.getMonth();

  function renderCal(){
    const grid = document.getElementById('calGrid');
    const label = document.getElementById('calLabel');
    label.textContent = new Date(calYear, calMonth, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    const daysCount = new Date(calYear, calMonth+1, 0).getDate();
    const firstWeekday = new Date(calYear, calMonth, 1).getDay();
    let cells = ['S','M','T','W','T','F','S'].map(h=>'<div class="cal-head">'+h+'</div>').join('');
    for (let i=0;i<firstWeekday;i++) cells += '<div class="cal-cell blank"></div>';
    for (let d=1; d<=daysCount; d++){
      const iso = isoDate(calYear, calMonth, d);
      const isPast = iso < todayISO();
      if (isPast){
        cells += '<div class="cal-cell disabled">'+d+'</div>';
      } else {
        const selected = dates.includes(iso);
        const clash = confirmedDays[iso];
        cells += '<div class="cal-cell" data-d="'+iso+'"'+(clash ? ' title="Already set: '+escapeHtml(clash)+'"' : '')+' style="'+(selected ? 'background:var(--accent);border-color:var(--accent);color:#fff;' : '')+'">'+d+(clash ? '<span class="cal-dot"'+(selected?' style="background:#FBF7EE;"':'')+'></span>' : '')+'</div>';
      }
    }
    grid.innerHTML = cells;
    grid.querySelectorAll('.cal-cell[data-d]').forEach(cell => {
      cell.onclick = () => {
        const d = cell.getAttribute('data-d');
        const idx = dates.indexOf(d);
        if (idx>=0) dates.splice(idx,1); else dates.push(d);
        renderCal(); renderDates();
      };
    });
  }
  document.getElementById('prevM').onclick = () => { calMonth--; if (calMonth<0){calMonth=11;calYear--;} renderCal(); };
  document.getElementById('nextM').onclick = () => { calMonth++; if (calMonth>11){calMonth=0;calYear++;} renderCal(); };

  function renderDates(){
    const list = document.getElementById('dateList');
    if (dates.length === 0){ list.innerHTML = '<p class="muted" style="margin-top:0;">No days selected yet.</p>'; return; }
    const warnIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>';
    list.innerHTML = dates.slice().sort().map(function(d){
      const clash = confirmedDays[d];
      return '<div class="date-chip" data-d="'+d+'"><span>'+fmtDateShort(d)+'</span><button data-remove="'+d+'">Remove</button></div>' +
        (clash ? '<div class="clash-note">'+warnIcon+'<span>Heads up — you already have <strong>'+escapeHtml(clash)+'</strong> set for this day.</span></div>' : '');
    }).join('');
    list.querySelectorAll('[data-remove]').forEach(btn => {
      btn.onclick = () => { const d = btn.getAttribute('data-remove'); const idx = dates.indexOf(d); if (idx>=0) dates.splice(idx,1); renderCal(); renderDates(); };
    });
  }
  renderCal();
  renderDates();

  document.getElementById('createBtn').onclick = async () => {
    if (whoAdding) commitWho(document.getElementById('whoName') ? document.getElementById('whoName').value : '');
    const errEl = document.getElementById('err'); errEl.style.display = 'none';
    const title = document.getElementById('title').value.trim() || 'Untitled plan';
    const organizerName = getMyName() || null;
    const location = document.getElementById('location').value.trim() || null;
    const timeLabel = document.getElementById('timeLabel').value.trim();
    if (dates.length === 0){ errEl.textContent = 'Pick at least one day that could work.'; errEl.style.display = 'block'; return; }
    if (!timeLabel){ errEl.textContent = 'Add a time — it’s the same for each day.'; errEl.style.display = 'block'; return; }
    const payload = { title: title, dates: dates.slice(), timeLabel: timeLabel, organizerName: organizerName, location: location, eventNote: null, people: people.slice() };
    // build the plan first — then have them make an account to save it
    if (!currentUser){
      renderAuth({
        mode: 'signup',
        heading: 'Save your plan',
        blurb: 'Create an account so you can manage this plan and find it later. Your people won\'t need one to vote.',
        next: function(){ finalizeCreatePlan(payload); }
      });
      return;
    }
    finalizeCreatePlan(payload);
  };
}

// creates the plan in the database (owner = current account) and opens its dashboard
async function finalizeCreatePlan(payload){
  render('');
  const slug = slugify(payload.title) + '-' + randomSuffix();
  const { data: plan, error } = await sb.rpc('create_plan', { p_title: payload.title, p_dates: payload.dates, p_time_label: payload.timeLabel, p_organizer_name: payload.organizerName, p_location: payload.location, p_event_note: payload.eventNote, p_slug: slug, p_passcode: null });
  if (error || !plan){
    render(
      '<a class="top-link" href="?new=1">&larr; Back</a>' +
      '<div class="card"><h2 style="margin-top:0;">Couldn\'t save the plan</h2>' +
      '<p class="subtitle">Something went wrong. Your account is set up — try creating the plan again.</p>' +
      '<a class="btn-primary" href="?new=1" style="text-decoration:none;text-align:center;display:block;">Try again</a></div>'
    );
    return;
  }
  plan.friends = []; plan.dayResponses = []; plan.knownDates = plan.dates.slice().sort(); plan.candidateDates = plan.dates.slice().sort(); plan.pendingDates = []; plan.addedBy = {};
  // add the people invited during create
  if (payload.people && payload.people.length){
    for (const person of payload.people){
      try {
        const { data: friend } = await sb.rpc('join_plan', { p_plan_id: plan.id, p_name: person.name, p_color: person.color || avatarColor(person.name) });
        if (friend) plan.friends.push(friend);
      } catch(e){}
    }
  }
  addMyEvent(plan);
  markOrganizer(plan.id);
  unlockAdmin(plan.id);
  history.replaceState(null, '', '?plan=' + plan.id + '&admin=1');
  renderPersonalize(plan);
}

// A cluster of people — imperfect, overlapping, each settling in like they've entered the room.
function clusterFaces(friends, size, opts){
  // A cluster of people — cleanly aligned, gently overlapping. Wraps at perRow so a long
  // list scatters into stacked rows instead of an endless overlapping smoosh.
  opts = opts || {};
  size = size || 30;
  const animate = opts.animate !== false;
  const perRow = opts.perRow || 5;
  const maxRows = opts.maxRows || 2;
  const maxShown = perRow * maxRows;
  const overlap = (opts.overlap != null) ? opts.overlap : Math.round(size * 0.32);
  const prefSet = opts.prefIds ? (opts.prefIds.has ? opts.prefIds : new Set(opts.prefIds)) : null;
  const orgId = opts.orgId || null;
  const orgNameL = (opts.orgName || '').trim().toLowerCase();
  const isOrgF = f => (orgId && f.id === orgId) || (orgNameL && (f.name||'').trim().toLowerCase() === orgNameL);
  const starSize = Math.round(size*0.44), starFont = Math.round(size*0.26);
  const extra = friends.length > maxShown ? friends.length - (maxShown - 1) : 0;
  const shown = extra ? friends.slice(0, maxShown - 1) : friends.slice(0, maxShown);
  const rows = [];
  for (let i = 0; i < shown.length; i += perRow) rows.push(shown.slice(i, i + perRow));
  const rowGap = Math.round(size * 0.22);
  const html = rows.map((row, ri) => {
    const items = row.map((f, gi) => {
      const idx = ri * perRow + gi;
      const star = isOrgF(f) ? '<span title="Organizer" style="position:absolute;bottom:-1px;right:-1px;width:'+starSize+'px;height:'+starSize+'px;border-radius:50%;background:var(--accent);border:2px solid var(--card);display:flex;align-items:center;justify-content:center;font-size:'+starFont+'px;color:#fff;line-height:1;">&#9733;</span>' : '';
      const zi = isOrgF(f) ? 60 : (40 - idx);
      return '<span class="'+(animate?'enter-room':'')+'" style="margin-left:'+(gi ? -overlap : 0)+'px;display:inline-block;position:relative;z-index:'+zi+';'+(animate?'animation-delay:'+(idx*45)+'ms;':'')+'">'+avatarHtml(f, size, prefSet && prefSet.has(f.id) ? 'var(--pref)' : null)+star+'</span>';
    }).join('');
    const plus = (extra && ri === rows.length - 1) ? '<span style="margin-left:8px;align-self:center;font-size:12.5px;color:var(--muted2);font-weight:600;">+'+extra+'</span>' : '';
    return '<div style="display:flex;align-items:center;'+(ri ? 'margin-top:'+rowGap+'px;' : '')+'">'+items+plus+'</div>';
  }).join('');
  return '<div style="display:inline-flex;flex-direction:column;">'+html+'</div>';
}

function renderRoster(plan, meId){
  const submitted = submittedFriendIds(plan);
  if (plan.friends.length === 0) return '';
  const orgName = (plan.organizer_name || '').trim().toLowerCase();
  function checkOrg(f){ return plan.organizer_friend_id ? (f.id === plan.organizer_friend_id) : !!(orgName && f.name.trim().toLowerCase() === orgName); }
  const sortedFriends = plan.friends.slice().sort((a,b) => (checkOrg(b)?1:0) - (checkOrg(a)?1:0) || a.name.localeCompare(b.name));
  const items = sortedFriends.map(f => {
    const has = submitted.has(f.id);
    const isOrg = checkOrg(f);
    const badge = isOrg
      ? '<span title="Organizer" style="position:absolute;bottom:-2px;right:-2px;width:19px;height:19px;border-radius:50%;background:var(--accent);border:2px solid #FFFFFF;display:flex;align-items:center;justify-content:center;font-size:10px;color:#FFED9E;">&#9733;</span>'
      : '';
    const pillBg = isOrg ? 'linear-gradient(135deg, rgba(66,107,194,0.14), rgba(74,145,102,0.16))' : (has ? 'rgba(74,145,102,.16)' : 'rgba(180,187,175,.28)');
    const pillColor = isOrg ? 'var(--accent)' : (has ? 'var(--pref)' : 'var(--muted1)');
    const pillText = isOrg ? 'Organizer' : (has ? 'Submitted' : 'Waiting');
    return '<div style="display:flex;flex-direction:column;align-items:center;gap:5px;width:66px;padding:8px 4px;border-radius:16px;align-self:flex-start;'+(isOrg ? 'background:rgba(74,145,102,0.08);' : '')+'">' +
      '<div class="rosterAvatar" data-fid="'+f.id+'" style="position:relative;cursor:pointer;">' + avatarHtml(f, 52, has ? 'var(--pref)' : null) + badge + '</div>' +
      '<span style="font-size:11px;color:var(--muted1);text-align:center;line-height:1.2;">'+escapeHtml(f.name)+(f.id===meId?' (you)':'')+'</span>' +
      '<span style="font-size:9px;font-weight:700;padding:3px 8px;border-radius:20px;background:'+pillBg+';color:'+pillColor+';">'+pillText+'</span>' +
      '</div>';
  }).join('');
  return '<p class="invitees-banner-title">Who\'s in?</p>' +
    '<div style="display:flex;flex-wrap:wrap;justify-content:center;gap:14px;max-width:320px;margin:0 auto;">'+items+'</div>';
}

function friendDotsForDate(plan, date, excludeFriendId, align){
  const resp = plan.dayResponses.filter(r => r.date === date && r.friend_id !== excludeFriendId);
  if (resp.length === 0) return '';
  return '<div style="display:flex;gap:3px;margin-top:4px;justify-content:'+(align||'flex-start')+';">' + resp.map(r => {
    const f = plan.friends.find(fr => fr.id === r.friend_id);
    if (!f) return '';
    const inner = f.photo_url
      ? '<img src="'+f.photo_url+'" alt="'+escapeHtml(f.name)+'" style="width:16px;height:16px;border-radius:50%;object-fit:cover;" />'
      : '<span style="width:16px;height:16px;border-radius:50%;background:'+(f.color||avatarColor(f.name))+';color:#fff;font-size:8px;font-weight:700;display:flex;align-items:center;justify-content:center;">'+initials(f.name)+'</span>';
    return '<span class="friendDot" data-fname="'+escapeHtml(f.name)+'" style="position:relative;display:inline-block;cursor:pointer;" title="'+escapeHtml(f.name)+' - '+STATE_LABEL[r.state]+'">'
      + inner
      + '<span style="position:absolute;bottom:-2px;right:-2px;width:8px;height:8px;border-radius:50%;background:'+STATE_COLOR[r.state]+';border:1px solid #FFFFFF;"></span></span>';
  }).join('') + '</div>';
}

function wireFriendDots(container){
  (container || document).querySelectorAll('.friendDot[data-fname]').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      showToast(el.getAttribute('data-fname'));
    };
  });
}

function submittedFriendsList(plan, excludeId){
  const sub = new Set(plan.dayResponses.map(r => r.friend_id));
  return plan.friends.filter(f => sub.has(f.id) && f.id !== excludeId);
}
function waitingFriendsList(plan){
  const sub = new Set(plan.dayResponses.map(r => r.friend_id));
  return plan.friends.filter(f => !sub.has(f.id));
}
function voteLedeHtml(plan, me){
  const answered = submittedFriendsList(plan, me.id);
  const waiting = waitingFriendsList(plan).filter(f => f.id !== me.id);
  if (!answered.length) return '<p style="font-size:15px;font-weight:500;color:var(--muted1);margin:0 0 10px;line-height:1.45;">You\'re first in — kick it off and pick your days!</p>';
  const faces = '<div style="margin:10px 0 20px;">'+clusterFaces(answered, 38, {maxRows:20, overlap:6, perRow:9, orgId: plan.organizer_friend_id, orgName: plan.organizer_name})+'</div>';
  const names = escapeHtml(namesListText(answered.map(f => f.name)));
  const txt = waiting.length === 0 ? ('<b>'+names+'</b> are all in — add yours and let\'s make it happen!') : ('<b>'+names+'</b> already jumped in — add your days!');
  return faces + '<p style="font-size:15px;font-weight:500;color:var(--muted1);margin:0 0 10px;line-height:1.45;">'+txt+'</p>';
}
function stillToHearHtml(plan){
  const waiting = waitingFriendsList(plan);
  if (!waiting.length || !plan.friends.length) return '';
  const faces = '<div style="display:flex;">'+waiting.slice(0,5).map((f,i) => '<span style="margin-left:'+(i?-8:0)+'px;display:inline-block;">'+avatarHtml(f,34)+'</span>').join('')+'</div>';
  const names = escapeHtml(namesListText(waiting.map(f => f.name)));
  const txt = waiting.length <= 3 ? ('Just <b>'+names+'</b> left.') : (waiting.length+' still to answer.');
  return '<p class="section-label" style="margin-top:0;">Still to hear from</p>' +
    '<div style="display:flex;align-items:center;gap:12px;margin-bottom:6px;">'+faces+'<span style="font-size:14px;color:var(--text);font-weight:500;">'+txt+'</span></div>';
}
function availBreakdownHtml(plan, d, pct){
  const resp = plan.dayResponses.filter(r => r.date === d);
  const avail = resp.filter(r => r.state !== 'no').map(r => plan.friends.find(f => f.id === r.friend_id)).filter(Boolean);
  const cant = resp.filter(r => r.state === 'no').map(r => plan.friends.find(f => f.id === r.friend_id)).filter(Boolean);
  if (pct == null){ const t = avail.length + cant.length; pct = t ? Math.round(avail.length / t * 100) : 0; }
  function faces(list){ return list.length ? '<div style="display:flex;flex-wrap:wrap;gap:6px;">'+list.map(f => '<span style="display:inline-block;">'+avatarHtml(f,28)+'</span>').join('')+'</div>' : '<span class="muted" style="font-size:12.5px;">No one yet</span>'; }
  const bar = '<div style="display:flex;align-items:center;gap:10px;">' +
    '<div class="avail" style="height:6px;"><span style="width:'+pct+'%;"></span></div>' +
    '<span style="font-size:12px;color:var(--muted1);font-weight:600;white-space:nowrap;">'+avail.length+' free</span></div>';
  return '<div style="padding:4px 14px 16px;"><div style="border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:14px;">' +
    bar +
    '<div class="brk"><span class="blab" style="color:var(--free-ink);">Free</span>'+faces(avail)+'</div>' +
    '<div class="brk"><span class="blab" style="color:var(--no);">Can\'t</span>'+faces(cant)+'</div>' +
    '</div></div>';
}
function consensusBreakdownHtml(plan, d){
  const resp = plan.dayResponses.filter(r => r.date === d);
  const grp = s => resp.filter(r => r.state === s).map(r => plan.friends.find(f => f.id === r.friend_id)).filter(Boolean);
  const pref = grp('preferred'), free = grp('free'), cant = grp('no');
  const availN = pref.length + free.length, total = availN + cant.length;
  const pct = total ? Math.round(availN / total * 100) : 0;
  function faces(list){ return list.length ? '<div style="display:flex;flex-wrap:wrap;gap:6px;">'+list.map(f => '<span style="display:inline-block;">'+avatarHtml(f,28)+'</span>').join('')+'</div>' : '<span class="muted" style="font-size:12.5px;">No one</span>'; }
  const bar = '<div style="display:flex;align-items:center;gap:10px;">' +
    '<div class="avail" style="height:6px;"><span style="width:'+pct+'%;"></span></div>' +
    '<span style="font-size:12px;color:var(--muted1);font-weight:600;white-space:nowrap;">'+availN+' free</span></div>';
  return '<div style="padding:4px 14px 16px;"><div style="border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:14px;">' +
    bar +
    '<div class="brk"><span class="blab" style="color:var(--pref-ink);">Prefer</span>'+faces(pref)+'</div>' +
    '<div class="brk"><span class="blab" style="color:var(--free-ink);">Free</span>'+faces(free)+'</div>' +
    '<div class="brk"><span class="blab" style="color:var(--no);">Can\'t</span>'+faces(cant)+'</div>' +
    '</div></div>';
}
function renderDayPicker(plan, me){
  const originalStates = {};
  plan.dayResponses.filter(r => r.friend_id === me.id).forEach(r => { originalStates[r.date] = r.state; });
  const dayStates = Object.assign({}, originalStates);
  const expandedDates = new Set();
  const hasSubmitted = Object.keys(originalStates).length > 0;
  let calOpen = true;
  let flagMissing = false;
  const topPickForList = computeTopPick(plan);
  const topDatesForList = new Set(topPickForList ? topPickForList.rows.map(r => r.date) : []);
  const alreadyNotifiedNewDays = new Set();

  async function notifyNewDayNow(d, state){
    try {
      await sb.rpc('set_one_response', { p_plan_id: plan.id, p_friend_id: me.id, p_friend_name: me.name, p_date: d, p_state: state });
      logActivity(plan.id, me, 'day_requested', fmtDateShort(d));
      alreadyNotifiedNewDays.add(d);
    } catch (e) {}
  }

  function closeTopPickModal(){
    const el = document.getElementById('topPickModalOverlay');
    if (el) el.remove();
  }

  function topPickFacesHtml(d){
    const order = { preferred: 0, free: 1, no: 2 };
    const withState = plan.friends.map(f => {
      const resp = plan.dayResponses.find(x => x.date === d && x.friend_id === f.id);
      return { f, state: resp ? resp.state : null };
    });
    withState.sort((a, b) => (a.state ? order[a.state] : 3) - (b.state ? order[b.state] : 3));
    const faces = plan.friends.length
      ? '<div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;">' +
        withState.map(({ f, state }) => {
          const ring = state ? STATE_COLOR[state] : 'var(--border)';
          const label = state === 'no' ? STATE_LABEL.no : (state === 'preferred' ? 'Preferred' : (state === 'free' ? 'Free' : 'No response'));
          return '<div style="display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;">' +
            avatarHtml(f, 48, ring) +
            '<span style="font-size:11px;color:var(--muted1);text-align:center;line-height:1.2;">'+escapeHtml(f.name)+'</span>' +
            '<span style="font-size:9px;font-weight:700;color:'+(state ? STATE_COLOR[state] : 'var(--muted2)')+';">'+label+'</span>' +
            '</div>';
        }).join('') +
        '</div>'
      : '<p class="muted" style="margin:0;">No attendees yet.</p>';
    return '<h3 style="margin:0 0 12px;padding-right:24px;">'+fmtDateShort(d)+'</h3>' + faces;
  }

  function openTopPickModal(dOrDates, confirmable){
    closeTopPickModal();
    const dates = Array.isArray(dOrDates) ? dOrDates : [dOrDates];
    const sections = dates.map(d => topPickFacesHtml(d)).join('<div style="height:1px;background:var(--border);margin:16px 0;"></div>');
    const confirmBlock = (confirmable && dates.length === 1) ?
      '<div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);display:flex;gap:8px;">' +
      '<button type="button" id="topPickModalYes" class="btn-submit" style="margin:0;flex:1;padding:10px;font-size:13px;">Yes, works for me</button>' +
      '<button type="button" id="topPickModalNo" class="btn-secondary" style="margin:0;flex:1;padding:10px;font-size:13px;">Maybe, I\'ll look at other options</button>' +
      '</div>' : '';
    const overlay = document.createElement('div');
    overlay.id = 'topPickModalOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(26,24,22,0.5);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;';
    overlay.innerHTML = '<div style="background:#FFFFFF;border-radius:20px;padding:22px 20px;max-width:360px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,0.25);position:relative;">' +
      '<button type="button" id="topPickModalClose" aria-label="Close" style="position:absolute;top:14px;right:14px;background:transparent;color:var(--muted2);font-size:22px;line-height:1;padding:4px;min-height:auto;">&times;</button>' +
      sections + confirmBlock +
      '</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeTopPickModal(); });
    document.getElementById('topPickModalClose').onclick = closeTopPickModal;
    const yesBtn = document.getElementById('topPickModalYes');
    if (yesBtn){
      yesBtn.onclick = () => {
        Object.keys(dayStates).forEach(k => { if (dayStates[k] === 'preferred') delete dayStates[k]; });
        dayStates[dates[0]] = 'preferred';
        showToast('Thanks for confirming! Please also provide answers for the other options, just in case.', 4000);
        const r = yesBtn.getBoundingClientRect();
        burstSparkles(r.left + r.width/2, r.top + r.height/2);
        closeTopPickModal();
        renderMain();
        document.getElementById('days')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
    }
    const noBtn = document.getElementById('topPickModalNo');
    if (noBtn){
      noBtn.onclick = () => {
        closeTopPickModal();
        document.getElementById('days')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      };
    }
  }
  const today = new Date();
  let calYear = today.getFullYear(), calMonth = today.getMonth();
  if (plan.candidateDates.length){
    const first = new Date(plan.candidateDates[0] + 'T00:00:00');
    calYear = first.getFullYear(); calMonth = first.getMonth();
  }

  function stBtn(d, s, active){
    const lbl = { no:"Can't", free:'Free', preferred:'Top' }[s];
    const onCss = active
      ? (s==='no' ? 'background:var(--no);border-color:var(--no);color:#fff;'
         : s==='free' ? 'background:var(--free);border-color:var(--free);color:var(--free-ink);'
         : 'background:var(--pref);border-color:var(--pref);color:#fff;')
      : 'background:#FFFFFF;border-color:var(--border);color:var(--muted2);';
    const star = s==='preferred' ? '<span style="font-size:11px;line-height:1;'+(active?'':'color:var(--pref);')+'">✦</span>' : '';
    return '<span class="stbtn'+(active?' on':'')+'" data-d="'+d+'" data-s="'+s+'" style="padding:8px 12px;border-radius:11px;border:1px solid;font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;'+onCss+'">'+star+lbl+'</span>';
  }

  function dayRow(d){
    const s = dayStates[d] || 'none';
    const eliminated = isEliminated(plan, d);
    const dd = new Date(d+'T00:00:00');
    const dowL = dd.toLocaleDateString(undefined,{weekday:'short'});
    const dnumL = dd.toLocaleDateString(undefined,{month:'short',day:'numeric'});
    if (eliminated){
      return '<div class="vday'+(expandedDates.has(d) ? ' exp' : '')+'" data-d="'+d+'" style="background:rgba(192,82,78,0.05);border-color:var(--line);opacity:0.85;">' +
        '<div class="vote-row">' +
        '<div class="vr-date"><span class="vr-dow">'+dowL+'</span><span class="vr-dnum" style="text-decoration:line-through;color:var(--muted2);">'+dnumL+'</span></div>' +
        '<div style="flex:1;min-width:12px;"></div>' +
        '<span style="font-size:11px;font-weight:700;color:var(--no);display:inline-flex;align-items:center;gap:4px;white-space:nowrap;">&#10005; Eliminated</span>' +
        '<svg class="vr-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>' +
        '</div>' +
        '<div class="vr-detail"><p class="muted" style="margin:0;padding:2px 14px 10px;font-size:11.5px;">Most of the group can\'t do this day, so it\'s no longer an option.</p>'+availBreakdownHtml(plan, d)+'</div>' +
        '</div>';
    }
    const resp = plan.dayResponses.filter(r => r.date === d);
    const responded = resp.length;
    const canMake = resp.filter(r => r.state !== 'no').length;
    const pct = responded ? Math.round((canMake / responded) * 100) : 0;
    // Show the group's availability (bar + expandable breakdown) as soon as anyone has responded.
    const reveal = responded > 0;
    const cardBg = s === 'none' ? 'var(--card)' : (s==='free' ? 'rgba(166,207,242,0.14)' : (s==='preferred' ? 'rgba(74,145,102,0.10)' : 'rgba(192,82,78,0.09)'));
    const chev = reveal ? '<svg class="vr-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>' : '';
    return '<div class="vday'+(expandedDates.has(d) ? ' exp' : '')+(flagMissing && s === 'none' ? ' needs' : '')+'" data-d="'+d+'" style="background:'+cardBg+';border-color:var(--line);">' +
      '<div class="vote-row">' +
      '<div class="vr-date"><span class="vr-dow">'+dowL+'</span><span class="vr-dnum">'+dnumL+'</span></div>' +
      '<div style="flex:1;min-width:12px;"></div>' +
      '<span class="dstate">' + BTN_ORDER.map(s2 => stBtn(d, s2, s === s2)).join('') + '</span>' +
      chev +
      '</div>' +
      (reveal ? '<div class="vr-detail">'+availBreakdownHtml(plan, d, pct)+'</div>' : '') +
      '</div>';
  }

  let hasDrawnOnce = false;
  function renderMain(){
    const allDates = Array.from(new Set(plan.candidateDates.concat(Object.keys(dayStates)))).sort((a,b) => {
      const ea = isEliminated(plan, a) ? 1 : 0;
      const eb = isEliminated(plan, b) ? 1 : 0;
      return (ea - eb) || (a < b ? -1 : a > b ? 1 : 0);
    });
    const rows = allDates.map(dayRow).join('');
    const daysCount = new Date(calYear, calMonth+1, 0).getDate();
    const firstWeekday = new Date(calYear, calMonth, 1).getDay();
    const monthLabel = new Date(calYear, calMonth, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    let cells = '';
    for (let i=0;i<firstWeekday;i++) cells += '<div class="cal-cell blank"></div>';
    for (let d=1; d<=daysCount; d++){
      const iso = isoDate(calYear, calMonth, d);
      const isPast = iso < todayISO();
      const s = dayStates[iso] || 'none';
      if (isPast){
        cells += '<div class="cal-cell disabled">'+d+'</div>';
      } else {
        const isCandidate = plan.candidateDates.includes(iso);
        const eliminated = isCandidate && isEliminated(plan, iso);
        if (eliminated){
          const numHtmlElim = '<span style="font-size:11px;line-height:1;text-decoration:line-through;">'+d+'</span>';
          cells += '<div class="cal-cell disabled" style="border-color:transparent;background:rgba(192,82,78,0.06);color:var(--muted3);flex-direction:column;gap:0;">' + numHtmlElim + '</div>';
          continue;
        }
        const border = s === 'none' ? (isCandidate ? 'rgba(66,107,194,0.3)' : 'var(--border)') : 'transparent';
        const textColor = s === 'none' ? 'var(--text)' : STATE_COLOR[s];
        const bg = s === 'none' ? '#FFFFFF' : (s==='free' ? 'rgba(166,207,242,0.2)' : (s==='preferred' ? 'rgba(74,145,102,0.15)' : 'rgba(192,82,78,0.12)'));
        const needsDot = isCandidate && s === 'none' ? '<span style="position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent);"></span>' : '';
        const numHtml = '<span style="font-size:11px;line-height:1;">'+d+'</span>';
        const glyphHtml = s !== 'none' ? '<span style="font-size:9px;line-height:1;margin-top:2px;">'+STATE_GLYPH[s]+'</span>' : '';
        cells += '<div class="cal-cell" data-d="'+iso+'" style="border-color:'+border+';background:'+bg+';color:'+textColor+';flex-direction:column;gap:0;">' + numHtml + glyphHtml + needsDot + '</div>';
      }
    }
    const calBlock =
      '<div class="cal-nav"><button id="prevM">&larr;</button><strong>'+monthLabel+'</strong><button id="nextM">&rarr;</button></div>' +
      '<div class="cal-grid">' + ['S','M','T','W','T','F','S'].map(h=>'<div class="cal-head">'+h+'</div>').join('') + cells + '</div>';

    const hasSuggested = Object.keys(dayStates).some(d => !plan.candidateDates.includes(d));
    render(
      topSectionsHtml(plan, me.id, '', true) +
      '<h2 style="margin:26px 0 10px;font-size:26px;letter-spacing:-0.03em;">Hey, '+escapeHtml(me.name)+'</h2>' +
      voteLedeHtml(plan, me) +
      '<p class="subtitle" style="margin:0 0 26px;">Just tap the days you could make it — star one you\'d love most.</p>' +
      '<div id="days" style="margin-top:10px;">'+rows+'</div>' +
      '<button type="button" id="suggestToggle" class="text-toggle">＋ None of these work? Suggest another day</button>' +
      '<div id="suggestWrap" style="display:'+(hasSuggested?'block':'none')+';margin-top:4px;">' +
      '<p class="muted" style="margin:2px 0 12px;font-size:12.5px;">Tap a day that isn\'t listed — the organizer approves it before others vote.</p>' +
      calBlock +
      '</div>' +
      '<div class="error" id="err" style="display:none;margin-top:14px;"></div>' +
      '<button class="btn-submit" id="saveBtn" style="margin-top:24px;">Send it over</button>',
      hasDrawnOnce
    );
    hasDrawnOnce = true;
    wireFriendDots();

    document.getElementById('days').querySelectorAll('.stbtn').forEach(btn => {
      btn.onclick = () => {
        const d = btn.getAttribute('data-d'), s = btn.getAttribute('data-s');
        if (dayStates[d] === s){ delete dayStates[d]; renderMain(); return; }
        if (s === 'preferred' && countPreferred(dayStates) >= MAX_PREFERRED){
          const errEl = document.getElementById('err');
          errEl.textContent = 'You can only mark one day as your top choice (preferred). Change your current pick first.';
          errEl.style.display = 'block';
          return;
        }
        dayStates[d] = s;
        const isConfirmMsg = s === 'preferred' && topDatesForList.has(d);
        showToast(isConfirmMsg ? 'Thanks for confirming! Please also provide answers for the other options, just in case.' : STATE_MEANING[s], isConfirmMsg ? 4000 : undefined);
        renderMain();
      };
    });
    document.getElementById('days').querySelectorAll('.vday').forEach(card => {
      const row = card.querySelector('.vote-row');
      if (!row || !card.querySelector('.vr-detail')) return;
      row.addEventListener('click', (e) => {
        if (e.target.closest('.stbtn')) return;
        const dd = card.getAttribute('data-d');
        if (expandedDates.has(dd)) expandedDates.delete(dd); else expandedDates.add(dd);
        card.classList.toggle('exp');
      });
    });
    {
      const st = document.getElementById('suggestToggle'), sw = document.getElementById('suggestWrap');
      if (st && sw){
        if (sw.style.display !== 'none') st.style.display = 'none';
        st.onclick = () => { sw.style.display = 'block'; st.style.display = 'none'; };
      }
    }
    {
      document.querySelectorAll('.cal-cell[data-d]').forEach(cell => {
        cell.onclick = () => {
          const d = cell.getAttribute('data-d');
          const isNewDay = !plan.candidateDates.includes(d) && !(d in dayStates);
          if (isNewDay && !confirm('New day selected — are you sure you want to add '+fmtDateShort(d)+'? It\'ll need the organizer\'s approval before others can vote on it.')) return;
          const idx = STATES.indexOf(dayStates[d] || 'none');
          const next = isNewDay ? 'preferred' : STATES[(idx+1) % STATES.length];
          if (next === 'preferred' && countPreferred(dayStates) >= MAX_PREFERRED){
            const errEl = document.getElementById('err');
            errEl.textContent = 'You can only mark one day as your top choice (preferred). Change your current pick first.';
            errEl.style.display = 'block';
            return;
          }
          if (next === 'preferred'){ const r = cell.getBoundingClientRect(); burstSparkles(r.left + r.width/2, r.top + r.height/2); }
          if (next === 'free'){ const r = cell.getBoundingClientRect(); burstSparkles(r.left + r.width/2, r.top + r.height/2, { count: 4, colors: ['#A6CFF2'], minSize: 7, sizeRange: 4, minDist: 12, distRange: 10, duration: 450 }); }
          if (next === 'none') delete dayStates[d]; else dayStates[d] = next;
          renderMain();
          if (isNewDay && next !== 'none'){
            showToast('Great, thanks! Please still enter your availability for the other days too.', 4000);
            notifyNewDayNow(d, next);
          }
        };
      });
      document.getElementById('prevM').onclick = () => { calMonth--; if (calMonth<0){calMonth=11;calYear--;} renderMain(); };
      document.getElementById('nextM').onclick = () => { calMonth++; if (calMonth>11){calMonth=0;calYear++;} renderMain(); };
    }
    {
      const tpb = document.getElementById('topPickBanner');
      if (tpb){
        tpb.onclick = () => {
          const top = computeTopPick(plan);
          const ds = (top && top.tied) ? top.rows.map(r => r.date) : tpb.getAttribute('data-d');
          openTopPickModal(ds, tpb.getAttribute('data-confirmable') === '1');
        };
      }
    }
    document.getElementById('saveBtn').onclick = async () => {
      const errEl = document.getElementById('err');
      const missing = plan.candidateDates.filter(d => !(d in dayStates) && !isEliminated(plan, d));
      if (missing.length){
        flagMissing = true;
        renderMain();
        const e2 = document.getElementById('err');
        if (e2){ e2.textContent = 'A few days still need an answer — they\'re highlighted below.'; e2.style.display = 'block'; }
        document.getElementById('days').querySelector('.vday[data-d="'+missing[0]+'"]')?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }
      if (countPreferred(dayStates) !== 1){
        errEl.textContent = 'Please mark exactly one day as your top choice (⭐ preferred) before submitting.';
        errEl.style.display = 'block';
        return;
      }
      errEl.style.display = 'none';
      const btn = document.getElementById('saveBtn'); btn.disabled = true; btn.textContent = 'Submitting...';
      let ok = true;
      {
        const { error } = await sb.rpc('submit_responses', { p_plan_id: plan.id, p_friend_id: me.id, p_friend_name: me.name, p_states: dayStates });
        if (error) ok = false;
      }
      if (ok){
        const isFirstSubmit = Object.keys(originalStates).length === 0;
        const summary = Object.keys(dayStates).sort().map(d => fmtDateShort(d)+': '+STATE_LABEL[dayStates[d]]).join(', ');
        logActivity(plan.id, me, isFirstSubmit ? 'submitted' : 'edited', summary);
        const newlyRequestedDates = Object.keys(dayStates).filter(d => !plan.candidateDates.includes(d) && !(d in originalStates) && !alreadyNotifiedNewDays.has(d));
        if (newlyRequestedDates.length){
          logActivity(plan.id, me, 'day_requested', newlyRequestedDates.sort().map(fmtDateShort).join(', '));
        }
      }
      if (!ok){
        const errEl = document.getElementById('err');
        errEl.textContent = 'Could not submit. Check your connection and try again.';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Submit';
        return;
      }
      const fresh = await loadPlan(plan.id);
      const meColor = (plan.friends.find(f => f.id === me.id) || {}).color || avatarColor(me.name);
      const wasFirstSubmit = Object.keys(originalStates).length === 0;
      threadTransition(btn, meColor, () => { renderResults(fresh, { justSaved: true }); if (wasFirstSubmit) showNotifyOptInModal(fresh, me); });
    };
  }

  renderMain();
}

function renderResults(plan, opts){
  opts = opts || {};
  const totalFriends = plan.friends.length;
  const rows = plan.knownDates.map(d => {
    const resp = plan.dayResponses.filter(r => r.date === d);
    const free = resp.filter(r => r.state === 'free').map(r => r.friend_id);
    const pref = resp.filter(r => r.state === 'preferred').map(r => r.friend_id);
    const no = resp.filter(r => r.state === 'no').map(r => r.friend_id);
    const score = free.length + pref.length*2 - no.length*3;
    return { date: d, free, pref, no, score };
  });
  const rowsByDate = {};
  rows.forEach(r => { rowsByDate[r.date] = r; });
  const answered = rows.filter(r => r.free.length + r.pref.length + r.no.length > 0);
  const topPick = computeTopPick(plan);
  const topDates = new Set(topPick ? topPick.rows.map(r => r.date) : []);

  let calYear, calMonth;
  if (plan.knownDates.length){
    const first = new Date(plan.knownDates[0] + 'T00:00:00');
    calYear = first.getFullYear(); calMonth = first.getMonth();
  } else {
    const t = new Date(); calYear = t.getFullYear(); calMonth = t.getMonth();
  }

  function cellStyleFor(r){
    if (!r || (r.free.length + r.pref.length + r.no.length === 0)) return { bg:'#FFFFFF', border:'var(--border)' };
    if (r.score < 0){
      const intensity = Math.min(0.4, 0.14 + (r.no.length/Math.max(1,totalFriends))*0.34);
      return { bg:'rgba(192,82,78,'+intensity+')', border:'rgba(192,82,78,0.3)' };
    }
    const intensity = Math.min(0.4, 0.12 + (r.score/Math.max(1,totalFriends*2))*0.4);
    return { bg:'rgba(74,145,102,'+intensity+')', border:'rgba(74,145,102,0.3)' };
  }

  function leadingPickHtml(){
    if (!topPick) return '';
    if (topPick.mode === 'none') return noOverlapBannerHtml();
    const primary = topPick.rows[0];
    const isNeg = !topPick.tied && topPick.mode === 'free' && primary.freeNames.length === 0;
    const dateLabel = topPick.tied ? topPick.rows.map(r => fmtDateShort(r.date)).join(' & ') : fmtDateShort(primary.date);
    const pillText = topPick.tied ? 'WORKS FOR MOST' : (isNeg ? 'HEADS UP' : 'WORKS FOR MOST');
    const pillColor = isNeg ? 'var(--no)' : 'var(--pref-ink)';
    return '<div id="leadingPickBanner" data-d="'+primary.date+'" style="cursor:pointer;position:relative;background:'+(isNeg ? 'rgba(192,82,78,.08)' : 'rgba(74,145,102,.08)')+';border-radius:18px;padding:22px 20px;margin-bottom:18px;">' +
      '<span style="display:inline-flex;align-items:center;gap:6px;color:'+pillColor+';font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;">'+pillText+'</span>' +
      '<p style="margin:8px 0 0;font-weight:700;font-size:28px;letter-spacing:-0.02em;color:'+(isNeg ? 'var(--no)' : 'var(--text)')+';">'+dateLabel+(topPick.tied ? '' : ' <span style="font-weight:400;font-style:italic;font-size:12px;color:var(--muted2);">could still change</span>')+'</p>' +
      '<span aria-hidden="true" style="position:absolute;bottom:14px;right:16px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,0.6);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted2);">?</span>' +
      '</div>';
  }

  function calHtml(){
    const daysCount = new Date(calYear, calMonth+1, 0).getDate();
    const firstWeekday = new Date(calYear, calMonth, 1).getDay();
    const monthLabel = new Date(calYear, calMonth, 1).toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
    let cells = '';
    for (let i=0;i<firstWeekday;i++) cells += '<div class="result-cal-cell blank"></div>';
    for (let d=1; d<=daysCount; d++){
      const iso = isoDate(calYear, calMonth, d);
      const r = rowsByDate[iso];
      if (!r){
        cells += '<div class="result-cal-cell" style="background:transparent;border-color:transparent;cursor:default;color:var(--muted3);"><span class="rdate">'+d+'</span></div>';
        continue;
      }
      const style = cellStyleFor(r);
      const isTop = topDates.has(iso);
      cells += '<div class="result-cal-cell" data-d="'+iso+'" style="background:'+style.bg+';border-color:'+style.border+';'+(isTop ? 'box-shadow:0 0 0 2px var(--pref);' : '')+'">' +
        '<span class="rdate">'+d+'</span>' +
        '</div>';
    }
    return '<div class="cal-nav"><button type="button" id="prevM">&larr;</button><strong>'+monthLabel+'</strong><button type="button" id="nextM">&rarr;</button></div>' +
      '<div class="result-cal-grid">' + ['S','M','T','W','T','F','S'].map(h=>'<div class="cal-head">'+h+'</div>').join('') + cells + '</div>';
  }

  function facesFromIds(ids, prefIds){
    const fs = ids.map(id => plan.friends.find(f => f.id === id)).filter(Boolean);
    if (!fs.length) return '<span class="muted" style="font-size:12.5px;">No one yet</span>';
    return clusterFaces(fs, 30, { prefIds: prefIds, perRow: 8 });
  }
  function dayListHtml(){
    if (!plan.knownDates.length) return '';
    // Ordered most-available to least (availability, then how many prefer it, then date)
    const ordered = plan.knownDates.slice().sort((a,b) => {
      const ra = rowsByDate[a] || { free:[], pref:[], no:[] };
      const rb = rowsByDate[b] || { free:[], pref:[], no:[] };
      const ca = ra.pref.length + ra.free.length, cb = rb.pref.length + rb.free.length;
      return (cb - ca) || (rb.pref.length - ra.pref.length) || (a < b ? -1 : 1);
    });
    return '<p class="section-label">Current availability</p>' +
      '<p class="muted" style="margin:-4px 0 18px;font-size:12.5px;">Ordered by who can make it — tap a day to see everyone. ✦ marks a top pick.</p>' +
      ordered.map(d => {
      const r = rowsByDate[d] || { free:[], pref:[], no:[] };
      const canIds = r.pref.concat(r.free);
      const dd = new Date(d+'T00:00:00');
      const dow = dd.toLocaleDateString(undefined,{weekday:'short'});
      const dn = dd.toLocaleDateString(undefined,{month:'short',day:'numeric'});
      const prefTag = r.pref.length ? '<span style="display:block;font-size:11px;font-weight:700;color:var(--pref-ink);white-space:nowrap;margin-top:2px;">✦ '+r.pref.length+' top</span>' : '';
      const countTag = canIds.length ? '<span style="font-size:12px;color:var(--muted1);white-space:nowrap;font-weight:600;">'+canIds.length+' free</span>'+prefTag : '';
      return '<div class="avail-item" data-d="'+d+'">' +
        '<div class="avail-head">' +
        '<div class="vr-date" style="min-width:60px;"><span class="vr-dow">'+dow+'</span><span class="vr-dnum" style="font-size:17px;">'+dn+'</span></div>' +
        '<div style="flex:1;min-width:0;">'+facesFromIds(canIds, r.pref)+'</div>' +
        '<div style="text-align:right;">'+countTag+'</div>' +
        '<svg class="vr-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>' +
        '</div>' +
        '<div class="vr-detail">'+consensusBreakdownHtml(plan, d)+'</div>' +
        '</div>';
    }).join('');
  }

  function pendingDaysHtml(){
    if (!plan.pendingDates.length) return '';
    return '<div class="card">' +
      '<p class="muted" style="margin:0 0 10px;font-weight:700;">Suggested days <span style="font-weight:400;">(waiting on the organizer)</span></p>' +
      plan.pendingDates.map(d => {
        const resp = plan.dayResponses.filter(r => r.date === d);
        const total = resp.length;
        const suggestedBy = plan.addedBy[d];
        return '<div class="heat-row" data-d="'+d+'">' +
          '<div class="heat-top"><span class="dname">'+fmtDateShort(d)+'</span><span class="muted">'+total+' response'+(total===1?'':'s')+'</span></div>' +
          (suggestedBy ? '<p class="muted" style="margin:2px 0 6px;font-size:11px;">Suggested by '+escapeHtml(suggestedBy)+'</p>' : '') +
          friendDotsForDate(plan, d) +
          '</div>';
      }).join('') +
      '</div>';
  }

  function closeDayModal(){
    const el = document.getElementById('dayModalOverlay');
    if (el) el.remove();
  }

  function openDayModal(bodyHtml){
    closeDayModal();
    const overlay = document.createElement('div');
    overlay.id = 'dayModalOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(26,24,22,0.5);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;';
    overlay.innerHTML = '<div style="background:#FFFFFF;border-radius:20px;padding:22px 20px;max-width:360px;width:100%;max-height:80vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,0.25);position:relative;">' + bodyHtml + '</div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeDayModal(); });
  }

  function dateSectionHtml(d){
    const r = rowsByDate[d];
    const order = { preferred: 0, free: 1, no: 2 };
    const withState = plan.friends.map(f => {
      const resp = plan.dayResponses.find(x => x.date === d && x.friend_id === f.id);
      return { f, state: resp ? resp.state : null };
    });
    withState.sort((a, b) => {
      const aRank = a.state ? order[a.state] : 3;
      const bRank = b.state ? order[b.state] : 3;
      return aRank - bRank;
    });
    const total = r ? (r.free.length + r.pref.length + r.no.length) : plan.dayResponses.filter(x => x.date === d).length;
    const isPending = !plan.candidateDates.includes(d);
    const topTag = topDates.has(d) ? '<span class="badge pref" style="margin-left:8px;">Top choice</span>' : (isPending ? '<span class="badge" style="margin-left:8px;background:rgba(180,187,175,.3);color:var(--muted1);">Pending approval</span>' : '');
    return '<h3 style="margin:0 0 4px;padding-right:24px;">'+fmtDateShort(d)+topTag+'</h3>' +
      '<p class="muted" style="margin:0 0 14px;">'+(total ? (total+' response'+(total===1?'':'s')+' so far') : 'No answers yet')+(isPending ? ' &mdash; suggested by '+escapeHtml(plan.addedBy[d] || 'someone') : '')+'</p>' +
      (plan.friends.length ? (
        '<div style="display:flex;flex-wrap:wrap;gap:14px;justify-content:center;">' +
        withState.map(({ f, state }) => {
          const ring = state ? STATE_COLOR[state] : 'var(--border)';
          const label = state === 'no' ? STATE_LABEL.no : (state === 'preferred' ? 'Preferred' : (state === 'free' ? 'Free' : 'No response'));
          return '<div data-fid="'+f.id+'" class="dayModalFace" style="display:flex;flex-direction:column;align-items:center;gap:4px;width:64px;cursor:pointer;">' +
            avatarHtml(f, 48, ring) +
            '<span style="font-size:11px;color:var(--muted1);text-align:center;line-height:1.2;">'+escapeHtml(f.name)+'</span>' +
            '<span style="font-size:9px;font-weight:700;color:'+(state ? STATE_COLOR[state] : 'var(--muted2)')+';">'+label+'</span>' +
            '</div>';
        }).join('') +
        '</div>' +
        '<p class="muted" style="margin:14px 0 0;text-align:center;font-size:11px;">Tap a face to see their full answers</p>'
      ) : '<p class="muted" style="margin:0;">No attendees yet.</p>');
  }

  function showDetailFor(dOrDates){
    const dates = Array.isArray(dOrDates) ? dOrDates : [dOrDates];
    const sections = dates.map(d => dateSectionHtml(d)).join('<div style="height:1px;background:var(--border);margin:18px 0;"></div>');
    const body = '<button type="button" id="dayModalClose" aria-label="Close" style="position:absolute;top:14px;right:14px;background:transparent;color:var(--muted2);font-size:22px;line-height:1;padding:4px;min-height:auto;">&times;</button>' +
      sections;
    openDayModal(body);
    document.getElementById('dayModalClose').onclick = closeDayModal;
    document.querySelectorAll('.dayModalFace').forEach(el => {
      el.onclick = () => showPersonDetailFor(el.getAttribute('data-fid'));
    });
  }

  function showPersonDetailFor(fid){
    const f = plan.friends.find(x => x.id === fid);
    if (!f) return;
    const order = { preferred: 0, free: 1, no: 2 };
    const label = { preferred: 'Preferred', free: 'Free', no: STATE_LABEL.no };
    const badgeClass = { preferred: 'pref', free: 'free', no: 'no' };
    const resp = plan.dayResponses.filter(r => r.friend_id === fid).slice()
      .sort((a,b) => (order[a.state] - order[b.state]) || (a.date < b.date ? -1 : 1));
    const rows = resp.length
      ? resp.map(r => {
          const pendingNote = !plan.candidateDates.includes(r.date) ? ' <span class="muted" style="font-size:10px;">(pending approval)</span>' : '';
          return '<div class="friend-row"><span style="flex:1;">'+fmtDateShort(r.date)+pendingNote+'</span><span class="badge '+badgeClass[r.state]+'">'+label[r.state]+'</span></div>';
        }).join('')
      : '<p class="muted" style="margin:0;">No answers submitted yet.</p>';
    const body = '<button type="button" id="dayModalClose" aria-label="Close" style="position:absolute;top:14px;right:14px;background:transparent;color:var(--muted2);font-size:22px;line-height:1;padding:4px;min-height:auto;">&times;</button>' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-right:24px;">' + avatarHtml(f, 36) + '<h3 style="margin:0;">'+escapeHtml(f.name)+'\'s answers</h3></div>' +
      '<p class="muted" style="margin:0 0 10px;">Most to least preferred.</p>' +
      rows;
    openDayModal(body);
    document.getElementById('dayModalClose').onclick = closeDayModal;
  }

  function renderPage(){
    const me = getMe(plan.id);
    const hasSubmitted = me ? plan.dayResponses.some(r => r.friend_id === me.id) : false;
    const newDatesForMe = me ? plan.candidateDates.filter(d => !isEliminated(plan, d) && !plan.dayResponses.some(r => r.friend_id === me.id && r.date === d)) : [];
    const navLink = (me && !hasSubmitted)
      ? '<a class="top-link" href="?plan='+plan.id+'">&larr; Back to my days</a>'
      : '';
    const addOwnAvailLink = (!me && isOrganizer(plan.id))
      ? '<div class="center" style="margin-top:16px;"><a class="top-link" href="#" id="addOwnAvail">Want to add your own availability?</a></div>'
      : '';
    render(
      (opts.justSaved ? '<div class="card center" style="background:rgba(74,145,102,.12);border-color:var(--pref);"><p style="margin:0;color:var(--pref);font-weight:700;">Saved! Thanks '+escapeHtml(getMe(plan.id)?.name || '')+'.</p></div>' : '') +
      navLink +
      topSectionsHtml(plan, (getMe(plan.id)||{}).id, '', true) +
      '<div class="card">' +
      stillToHearHtml(plan) +
      (answered.length === 0 ? '<p class="muted" style="margin:0 0 12px;">No one has answered yet &mdash; check back after people submit.</p>' : '') +
      dayListHtml() +
      '</div>' +
      pendingDaysHtml() +
      (hasSubmitted && me && newDatesForMe.length ? '<div class="center"><a class="top-link" href="#" id="answerNewDaysLink" style="font-weight:700;">Answer '+newDatesForMe.length+' new day'+(newDatesForMe.length===1?'':'s')+'</a></div>' : '') +
      (hasSubmitted && me ? '<div class="center"><a class="top-link" href="#" id="viewMineLink">View your responses</a></div>' : '') +
      addOwnAvailLink +
      (isOrganizer(plan.id)
        ? '<div class="center"><a class="top-link" href="?plan='+plan.id+'&admin=1">Organizer dashboard</a></div>'
        : '<div class="center"><a class="top-link" href="?plan='+plan.id+'&admin=1" style="font-size:11px;opacity:0.6;">Log in as admin</a></div>')
    );
    document.querySelectorAll('.result-cal-cell[data-d]').forEach(cell => {
      cell.onclick = () => showDetailFor(cell.getAttribute('data-d'));
    });
    document.querySelectorAll('.heat-row[data-d]').forEach(row => {
      row.onclick = () => showDetailFor(row.getAttribute('data-d'));
    });
    document.querySelectorAll('.avail-item').forEach(item => {
      const head = item.querySelector('.avail-head');
      if (head) head.addEventListener('click', () => item.classList.toggle('exp'));
    });
    const leadingBanner = document.getElementById('leadingPickBanner');
    if (leadingBanner) leadingBanner.onclick = () => showDetailFor(topPick && topPick.tied ? topPick.rows.map(r => r.date) : leadingBanner.getAttribute('data-d'));
    document.querySelectorAll('.rosterAvatar[data-fid]').forEach(av => {
      av.onclick = () => showPersonDetailFor(av.getAttribute('data-fid'));
    });
    wireFriendDots();
    { const _pm=document.getElementById('prevM'); if(_pm) _pm.onclick = () => { calMonth--; if (calMonth<0){calMonth=11;calYear--;} renderPage(); };
      const _nm=document.getElementById('nextM'); if(_nm) _nm.onclick = () => { calMonth++; if (calMonth>11){calMonth=0;calYear++;} renderPage(); }; }
    const addOwn = document.getElementById('addOwnAvail');
    if (addOwn) addOwn.onclick = (e) => { e.preventDefault(); renderWhoAreYou(plan); };
    const viewMine = document.getElementById('viewMineLink');
    if (viewMine) viewMine.onclick = (e) => { e.preventDefault(); showPersonDetailFor(me.id); };
    const answerNewDaysLink = document.getElementById('answerNewDaysLink');
    if (answerNewDaysLink) answerNewDaysLink.onclick = (e) => { e.preventDefault(); renderDayPicker(plan, me); };
  }

  renderPage();
}

function renderAdminGate(plan){
  // account-owned plans: only the owner (logged in) can manage
  if (plan.am_owner){ unlockAdmin(plan.id); renderAdminPanel(plan); return; }
  if (plan.is_owned){
    if (!currentUser){
      renderAuth({ mode:'login', heading:'Log in to manage this plan', blurb:'This plan is tied to an account. Log in to manage it.', next:function(){ route(); } });
      return;
    }
    render(
      '<a class="top-link" href="?plan='+plan.id+'">&larr; View plan page</a>' +
      '<div class="card"><h2 style="margin-top:0;">Not your plan</h2>' +
      '<p class="subtitle">This plan belongs to another account. You can still view it and add your days.</p>' +
      '<a class="btn-primary" href="?plan='+plan.id+'" style="text-decoration:none;text-align:center;display:block;">View plan</a></div>'
    );
    return;
  }
  // legacy plans (created before accounts) keep the old passcode behavior
  if (!plan.has_passcode){ unlockAdmin(plan.id); renderAdminPanel(plan); return; }
  if (isAdminUnlocked(plan.id)){ renderAdminPanel(plan); return; }
  render(
    '<a class="top-link" href="?plan='+plan.id+'">&larr; View plan page</a>' +
    '<a class="top-link" href="?admin=1" style="margin-left:12px;">&larr; My plans</a>' +
    '<div class="card"><h2 style="margin-top:0;">Organizer sign-in</h2>' +
    '<p class="subtitle">Enter the passcode to manage this plan — the days, the people, and finalizing the date.</p>' +
    '<input type="password" id="passcode" placeholder="Passcode" />' +
    '<div class="error" id="err" style="display:none;"></div>' +
    '<button class="btn-primary" id="unlockBtn">Unlock</button></div>'
  );
  document.getElementById('unlockBtn').onclick = async () => {
    const code = document.getElementById('passcode').value;
    const errEl = document.getElementById('err'); const btn = document.getElementById('unlockBtn');
    btn.disabled = true; btn.textContent = 'Checking...';
    const { data, error } = await sb.rpc('check_admin_passcode', { p_plan_id: plan.id, p_passcode: code });
    btn.disabled = false; btn.textContent = 'Unlock';
    if (error || !data){ errEl.textContent = 'Incorrect passcode.'; errEl.style.display = 'block'; return; }
    setPass(plan.id, code);
    unlockAdmin(plan.id);
    renderAdminPanel(plan);
  };
}

const PHOTO_BUCKET = 'schedule-friend-photos';

// Straighten EXIF-rotated phone photos and cap size, so images look right everywhere
// (browsers honor EXIF orientation; the link-preview image generator does not).
async function normalizeImage(file){
  try {
    if (!file || !file.type || file.type.indexOf('image/') !== 0) return file;
    if (typeof createImageBitmap !== 'function') return file;
    const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' });
    let w = bmp.width, h = bmp.height;
    const MAX = 1600;
    if (Math.max(w, h) > MAX){ const s = MAX / Math.max(w, h); w = Math.round(w * s); h = Math.round(h * s); }
    const canvas = document.createElement('canvas'); canvas.width = w; canvas.height = h;
    canvas.getContext('2d').drawImage(bmp, 0, 0, w, h);
    if (bmp.close) bmp.close();
    const blob = await new Promise(function(res){ canvas.toBlob(res, 'image/jpeg', 0.9); });
    if (!blob) return file;
    return new File([blob], (file.name || 'photo').replace(/\.[^.]+$/, '') + '.jpg', { type: 'image/jpeg' });
  } catch(e){ return file; }
}

async function uploadFriendPhoto(planId, friendId, file){
  file = await normalizeImage(file);
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = planId + '/' + friendId + '-' + Date.now() + '.' + ext;
  const { error } = await sb.storage.from(PHOTO_BUCKET).upload(path, file, { upsert: false, contentType: file.type });
  if (error) return null;
  const { data } = sb.storage.from(PHOTO_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

async function uploadCoverPhoto(planId, file){
  file = await normalizeImage(file);
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase();
  const path = 'covers/' + planId + '-' + Date.now() + '.' + ext;
  const { error } = await sb.storage.from(PHOTO_BUCKET).upload(path, file, { upsert: false, contentType: file.type });
  if (error) return null;
  const { data } = sb.storage.from(PHOTO_BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

function wireAttendeesEditor(plan, onChange){
  function renderAttendeeList(){
    const listEl = document.getElementById('attendeeList');
    if (!listEl) return;
    if (plan.friends.length === 0){ listEl.innerHTML = '<p class="muted" style="margin-top:0;">No attendees yet.</p>'; return; }
    listEl.innerHTML = plan.friends.map(f => {
      const isOrg = f.id === plan.organizer_friend_id;
      const hasAnswers = plan.dayResponses && plan.dayResponses.some(r => r.friend_id === f.id);
      const status = isOrg ? 'Organizer' : (hasAnswers ? 'Answered' : 'Waiting to answer');
      const statusColor = isOrg ? 'var(--accent)' : (hasAnswers ? 'var(--pref-ink)' : 'var(--muted2)');
      return '<div class="attendee-row" data-fid="'+f.id+'">' +
      '<div class="attendee-top">' +
        avatarHtml(f, 44, hasAnswers ? 'var(--pref)' : null) +
        '<div class="attendee-name">' +
          '<div style="font-weight:600;font-size:15.5px;letter-spacing:-0.01em;">'+escapeHtml(f.name)+'</div>' +
          '<div style="font-size:12px;font-weight:600;color:'+statusColor+';margin-top:2px;">'+status+'</div>' +
        '</div>' +
        '<button class="attendee-remove" data-remove-friend="'+f.id+'" data-name="'+escapeHtml(f.name)+'" aria-label="Remove attendee">&times;</button>' +
      '</div>' +
      '<div class="attendee-actions">' +
      // NOTE: "Mark as organizer" toggle temporarily removed per request — re-enable later (see backlog)
      '<label class="photoLabel" data-fid="'+f.id+'">'+(f.photo_url ? 'Change photo' : 'Add photo')+'<input type="file" accept="image/*" class="photoInput" data-fid="'+f.id+'"></label>' +
      '<button data-mark-days="'+f.id+'" title="Set their answers yourself">Mark days</button>' +
      (hasAnswers ? '<button data-reset-answers="'+f.id+'" data-name="'+escapeHtml(f.name)+'" title="Clear their answers so they can resubmit">Reset</button>' : '') +
      '</div>' +
      '</div>';
    }).join('');
    listEl.querySelectorAll('[data-toggle-organizer]').forEach(orgBtn => {
      orgBtn.onclick = async () => {
        const fid = orgBtn.getAttribute('data-toggle-organizer');
        const f = plan.friends.find(x => x.id === fid);
        const wasOrg = plan.organizer_friend_id === fid;
        const newId = wasOrg ? null : fid;
        orgBtn.disabled = true;
        const { error } = await sb.rpc('org_update_plan', { p_plan_id: plan.id, p_passcode: getPass(plan.id), p_patch: { organizer_friend_id: newId, organizer_name: newId ? f.name : plan.organizer_name } });
        if (error){ showToast('Could not update organizer. Try again.'); orgBtn.disabled = false; return; }
        plan.organizer_friend_id = newId;
        if (newId) plan.organizer_name = f.name;
        showToast(newId ? (f.name + ' marked as organizer.') : 'Organizer removed.');
        renderAttendeeList();
        if (onChange) onChange();
      };
    });
    listEl.querySelectorAll('[data-mark-days]').forEach(markBtn => {
      markBtn.onclick = () => openMarkDaysModal(markBtn.getAttribute('data-mark-days'));
    });
    listEl.querySelectorAll('[data-reset-answers]').forEach(resetBtn => {
      resetBtn.onclick = async () => {
        const fid = resetBtn.getAttribute('data-reset-answers');
        const name = resetBtn.getAttribute('data-name');
        if (!confirm('Clear '+name+'\'s answers? They\'ll be able to go back in and submit fresh ones. This cannot be undone.')) return;
        resetBtn.disabled = true; resetBtn.textContent = 'Clearing...';
        const { error } = await sb.rpc('org_reset_answers', { p_plan_id: plan.id, p_friend_id: fid, p_passcode: getPass(plan.id) });
        if (error){ showToast('Could not clear answers. Try again.'); resetBtn.disabled = false; resetBtn.textContent = 'Reset answers'; return; }
        if (plan.dayResponses) plan.dayResponses = plan.dayResponses.filter(r => r.friend_id !== fid);
        showToast(name + '\'s answers cleared.');
        renderAttendeeList();
        if (onChange) onChange();
      };
    });
    listEl.querySelectorAll('[data-remove-friend]').forEach(delBtn => {
      delBtn.onclick = async () => {
        const fid = delBtn.getAttribute('data-remove-friend');
        const name = delBtn.getAttribute('data-name');
        if (!confirm('Remove '+name+'? This deletes their photo and any answers they\'ve submitted. This cannot be undone.')) return;
        delBtn.disabled = true;
        const { error } = await sb.rpc('org_remove_person', { p_plan_id: plan.id, p_friend_id: fid, p_passcode: getPass(plan.id) });
        if (error){ showToast('Could not remove attendee. Try again.'); delBtn.disabled = false; return; }
        plan.friends = plan.friends.filter(x => x.id !== fid);
        if (plan.dayResponses) plan.dayResponses = plan.dayResponses.filter(r => r.friend_id !== fid);
        showToast(name + ' removed.');
        renderAttendeeList();
        if (onChange) onChange();
      };
    });
    listEl.querySelectorAll('.photoInput').forEach(inp => {
      inp.onchange = async () => {
        const file = inp.files[0];
        if (!file) return;
        const fid = inp.getAttribute('data-fid');
        const f = plan.friends.find(x => x.id === fid);
        const label = listEl.querySelector('.photoLabel[data-fid="'+fid+'"]');
        if (label) label.firstChild.textContent = 'Saving...';
        const url = await uploadFriendPhoto(plan.id, fid, file);
        if (url){
          const { error } = await sb.rpc('org_set_friend_photo', { p_plan_id: plan.id, p_friend_id: fid, p_passcode: getPass(plan.id), p_url: url });
          if (error){
            showToast('Photo uploaded but could not be saved. Try again.');
            renderAttendeeList();
            return;
          }
          if (f) f.photo_url = url;
          showToast('Photo saved for ' + (f ? f.name : 'attendee') + '.');
          renderAttendeeList();
          if (onChange) onChange();
        } else {
          showToast('Could not upload that photo. Try again.');
          renderAttendeeList();
        }
      };
    });
  }

  function openMarkDaysModal(fid){
    const f = plan.friends.find(x => x.id === fid);
    if (!f) return;
    const dayStates = {};
    plan.dayResponses.filter(r => r.friend_id === fid).forEach(r => { dayStates[r.date] = r.state; });

    function stBtnAdmin(d, s, active){
      const lbl = { no:"Can't", free:'Free', preferred:'Top' }[s];
      const onCss = active
        ? (s==='no' ? 'background:var(--no);border-color:var(--no);color:#fff;'
           : s==='free' ? 'background:var(--free);border-color:var(--free);color:var(--free-ink);'
           : 'background:var(--pref);border-color:var(--pref);color:#fff;')
        : 'background:#FFFFFF;border-color:var(--border);color:var(--muted2);';
      const star = s==='preferred' ? '<span style="font-size:11px;line-height:1;'+(active?'':'color:var(--pref);')+'">✦</span>' : '';
      return '<span class="adminStBtn" data-d="'+d+'" data-s="'+s+'" style="padding:8px 12px;border-radius:11px;border:1px solid;font-size:12.5px;font-weight:600;cursor:pointer;flex-shrink:0;white-space:nowrap;display:inline-flex;align-items:center;gap:4px;'+onCss+'">'+star+lbl+'</span>';
    }

    function closeModal(){
      const el = document.getElementById('markDaysOverlay');
      if (el) el.remove();
    }

    async function save(){
      const btn = document.getElementById('markDaysSave');
      btn.disabled = true; btn.textContent = 'Saving...';
      let ok = true;
      {
        const { error } = await sb.rpc('org_set_responses', { p_plan_id: plan.id, p_friend_id: fid, p_passcode: getPass(plan.id), p_states: dayStates });
        if (error) ok = false;
      }
      if (!ok){
        const errEl = document.getElementById('markDaysErr');
        errEl.textContent = 'Could not save. Try again.';
        errEl.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Save';
        return;
      }
      plan.dayResponses = plan.dayResponses.filter(r => r.friend_id !== fid);
      Object.keys(dayStates).forEach(d => { plan.dayResponses.push({ friend_id: fid, date: d, state: dayStates[d], plan_id: plan.id }); });
      const summary = Object.keys(dayStates).length
        ? Object.keys(dayStates).sort().map(d => fmtDateShort(d)+': '+STATE_LABEL[dayStates[d]]).join(', ')
        : 'cleared all answers';
      logActivity(plan.id, { id: fid, name: f.name }, 'edited', 'Marked by organizer: ' + summary);
      showToast('Saved days for ' + f.name + '.');
      closeModal();
      renderAttendeeList();
      if (onChange) onChange();
    }

    function draw(){
      const rows = plan.knownDates.map(d => {
        const s = dayStates[d] || 'none';
        return '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);">' +
          '<span style="font-weight:700;font-size:14px;">'+fmtDateShort(d)+'</span>' +
          '<span style="display:flex;gap:8px;align-items:center;">' + BTN_ORDER.map(s2 => stBtnAdmin(d, s2, s === s2)).join('') + '</span>' +
          '</div>';
      }).join('');
      const overlay = document.getElementById('markDaysOverlay');
      const card = overlay.querySelector('.markDaysCard');
      card.innerHTML =
        '<button type="button" id="markDaysClose" aria-label="Close" style="position:absolute;top:14px;right:14px;background:transparent;color:var(--muted2);font-size:22px;line-height:1;padding:4px;min-height:auto;">&times;</button>' +
        '<div style="display:flex;align-items:center;gap:10px;margin-bottom:4px;padding-right:24px;">'+avatarHtml(f, 36)+'<h3 style="margin:0;">Mark days for '+escapeHtml(f.name)+'</h3></div>' +
        '<p class="muted" style="margin:0 0 12px;">Tap to set their answer for each day, then save.</p>' +
        (plan.knownDates.length ? rows : '<p class="muted">No candidate days yet.</p>') +
        '<div class="error" id="markDaysErr" style="display:none;margin-top:10px;"></div>' +
        '<button class="btn-primary" id="markDaysSave" style="margin-top:14px;">Save</button>';
      card.querySelectorAll('.adminStBtn').forEach(btn => {
        btn.onclick = () => {
          const d = btn.getAttribute('data-d'), s = btn.getAttribute('data-s');
          if (dayStates[d] === s){ delete dayStates[d]; } else { dayStates[d] = s; }
          draw();
        };
      });
      document.getElementById('markDaysClose').onclick = closeModal;
      document.getElementById('markDaysSave').onclick = save;
    }

    const overlay = document.createElement('div');
    overlay.id = 'markDaysOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(26,24,22,0.5);z-index:2000;display:flex;align-items:center;justify-content:center;padding:20px;';
    overlay.innerHTML = '<div class="markDaysCard" style="background:#FFFFFF;border-radius:20px;padding:22px 20px;max-width:380px;width:100%;max-height:82vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,0.25);position:relative;"></div>';
    document.body.appendChild(overlay);
    overlay.addEventListener('click', (e) => { if (e.target === overlay) closeModal(); });
    draw();
  }

  renderAttendeeList();

  document.getElementById('addAttendeeBtn').onclick = async () => {
    const name = document.getElementById('newAttendeeName').value.trim();
    const errEl = document.getElementById('attErr');
    if (!name){ errEl.textContent = 'Enter a name.'; errEl.style.display = 'block'; return; }
    const btn = document.getElementById('addAttendeeBtn'); btn.disabled = true; btn.textContent = 'Adding...';
    const { data: friend, error } = await sb.rpc('join_plan', { p_plan_id: plan.id, p_name: name, p_color: avatarColor(name) });
    if (error || !friend){ errEl.textContent = 'Could not add attendee.'; errEl.style.display = 'block'; btn.disabled = false; btn.textContent = 'Add attendee'; return; }
    plan.friends.push(friend);
    document.getElementById('newAttendeeName').value = '';
    errEl.style.display = 'none';
    btn.disabled = false; btn.textContent = 'Add attendee';
    renderAttendeeList();
    if (onChange) onChange();
  };
}
